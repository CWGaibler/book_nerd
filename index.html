}

function cfApply(b,at){
  var prev={status:b.status,currentPage:b.currentPage,startedAt:b.startedAt,finishedAt:b.finishedAt};
  var c0=chGet(),pc=c0?{complete:c0.complete,celebrated:c0.celebrated}:null,tr=cfTracked(b);
  if(at){b.finishedAt=at;if(!tr)b.startedAt=at;}else{delete b.finishedAt;delete b.startedAt;}
  b.updatedAt=Date.now();dbPut(b);
  chSync(b);refresh();
  toast('Finish Date Changed',{label:'Undo',fn:function(){
    restoreBook(b,prev);chSync(b);
    var c=chGet();if(c&&pc&&pc.complete&&c.credits.length>=c.target){c.complete=true;c.celebrated=pc.celebrated;chSave(c);}
    refresh();
  }});
}

function hqCur(){var rd=state.books.filter(function(b){return b.status==='reading';}).sort(function(a,b){return b.updatedAt-a.updatedAt;});return rd[0]||null;}
function hqQuote(cur){
  var qs=(cur&&cur.quotes)||[];if(!qs.length)return null;
  var h=state.hq,q=null;
  if(h&&h.bid===cur.id){for(var i=0;i<qs.length;i++){if(qs[i].id===h.qid){q=qs[i];break;}}}
  if(!q){q=qs[Math.floor(Math.random()*qs.length)];state.hq={bid:cur.id,qid:q.id};}
  return q;
}
function hqShuffle(){
  var cur=hqCur();if(!cur)return;
  var qs=cur.quotes||[];if(qs.length<2)return;
  var now=(state.hq&&state.hq.bid===cur.id)?state.hq.qid:'';
  var o=qs.filter(function(q){return q.id!==now;});
  var q=o[Math.floor(Math.random()*o.length)];
  state.hq={bid:cur.id,qid:q.id};refresh();
}
function hqHTML(cur){
  var q=hqQuote(cur);if(!q)return '';

}

var PARTS=['van','von','de','del','della','di','da','du','der','den','le','la','el','al','bin','ibn','st','saint'];
function sNorm(t){return String(t||'').normalize?String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim():String(t||'').toLowerCase().trim();}
function authorSortKey(b){
  var n=(authorNames(b.author||'')[0]||'').trim();if(!n)return '';
  var t=n.split(/[\s,]+/).filter(Boolean);
  while(t.length>1&&/^(jr|sr|ii|iii|iv|v|phd|md|esq)\.?$/i.test(t[t.length-1]))t.pop();
  var last=t.pop()||'',first=t.join(' ');
  while(t.length&&PARTS.indexOf(sNorm(t[t.length-1]).replace(/\./g,''))>=0){last=t.pop()+' '+last;}
  return sNorm(last)+'|'+sNorm(t.join(' ')||first);
}
function titleSortKey(b){return sNorm(b.title).replace(/^(the|a|an)\s+/,'');}
function cmpS(a,b){return a<b?-1:(a>b?1:0);}
function sortCmp(k){
  return function(a,b){
    var r=0;
    if(k==='old')r=(a.addedAt||0)-(b.addedAt||0);
    else if(k==='title')r=cmpS(titleSortKey(a),titleSortKey(b));
    else if(k==='author'){var x=authorSortKey(a),y=authorSortKey(b);if(!x&&y)return 1;if(x&&!y)return -1;r=cmpS(x,y);}
    else if(k==='rating'){var ra=a.rating||0,rb=b.rating||0;if(!ra&&rb)return 1;if(ra&&!rb)return -1;r=rb-ra;}
    else if(k==='fin'){var fa=a.finishedAt||0,fb=b.finishedAt||0;if(!fa&&fb)return 1;if(fa&&!fb)return -1;r=fb-fa;}
    if(r)return r;
    r=cmpS(titleSortKey(a),titleSortKey(b));
    return r||((b.addedAt||0)-(a.addedAt||0));
  };
}
function libFilter(){
  var all=state.books.slice().sort(function(a,b){return b.addedAt-a.addedAt;});
  var q=state.q.trim().toLowerCase();
  var list=all.filter(function(b){
    if(state.filter!=='all'&&b.status!==state.filter)return false;
    if(state.own==='owned'&&!isOwned(b))return false;
    if(state.own==='buy'&&isOwned(b))return false;
    if(q&&(b.title+' '+(b.author||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  if(state.sort!=='new')list.sort(sortCmp(state.sort));
  return {all:all,list:list};
}

function starsHTML(r,kind,sz){
  var h='<div class="stars" data-rate="'+kind+'" data-r="'+r+'" role="slider" tabindex="0" aria-label="Rating" aria-valuemin="0" aria-valuemax="5" aria-valuenow="'+r+'" aria-valuetext="'+(r?r+' out of 5':'Not rated')+'">';
  for(var i=1;i<=5;i++){var f=Math.max(0,Math.min(1,r-(i-1)));h+='<span class="star">'+ico('star',sz)+'<svg class="tb fl" width="'+sz+'" height="'+sz+'" aria-hidden="true" style="clip-path:inset(0 '+Math.round((1-f)*100)+'% 0 0)"><use href="#i-star"/></svg></span>';}
  return h+'</div>';
}
function paintStars(box,r){
  var fl=box.querySelectorAll('.fl');
  for(var i=0;i<fl.length;i++){var f=Math.max(0,Math.min(1,r-i));fl[i].style.clipPath='inset(0 '+Math.round((1-f)*100)+'% 0 0)';}
  box.setAttribute('aria-valuenow',r);box.setAttribute('aria-valuetext',r?r+' out of 5':'Not rated');
}
function starVal(box,e){
  var st=box.querySelectorAll('.star'),v=0.5;
  for(var i=0;i<st.length;i++){var r=st[i].getBoundingClientRect();
    if(e.clientX>=r.left+r.width/2)v=i+1;else if(e.clientX>=r.left){v=i+0.5;break;}else if(i===0){v=0.5;break;}else break;}
  return Math.max(0.5,Math.min(5,v));
}
function starCommit(box,v){
  var kind=box.getAttribute('data-rate');
  box.setAttribute('data-r',v);paintStars(box,v);
  if(kind==='detail'){var b=byId(state.id);if(!b)return;b.rating=v;b.updatedAt=Date.now();dbPut(b);refresh();}
  else if(kind==='rv'&&state.rev){state.rev.rating=v;}
}
var starG=null;
document.addEventListener('pointerdown',function(e){
  var box=e.target.closest?e.target.closest('.stars[data-rate]'):null;if(!box)return;
  var start=parseFloat(box.getAttribute('data-r'))||0;
  starG={box:box,id:e.pointerId,start:start,moved:false,cur:starVal(box,e)};
  try{box.setPointerCapture(e.pointerId);}catch(x){}
  paintStars(box,starG.cur);
});
document.addEventListener('pointermove',function(e){
  if(!starG||e.pointerId!==starG.id)return;
  var v=starVal(starG.box,e);if(v!==starG.cur){starG.moved=true;starG.cur=v;paintStars(starG.box,v);}
});
function starEnd(e,cancel){
  if(!starG||e.pointerId!==starG.id)return;
  var g=starG;starG=null;
  if(cancel){paintStars(g.box,g.start);return;}
  starCommit(g.box,(!g.moved&&g.cur===g.start)?0:g.cur);
}
document.addEventListener('pointerup',function(e){starEnd(e,false);});
document.addEventListener('pointercancel',function(e){starEnd(e,true);});
document.addEventListener('keydown',function(e){
  var box=e.target.closest?e.target.closest('.stars[data-rate]'):null;if(!box)return;
  var r=parseFloat(box.getAttribute('data-r'))||0,d=(e.key==='ArrowRight'||e.key==='ArrowUp')?0.5:((e.key==='ArrowLeft'||e.key==='ArrowDown')?-0.5:0);
  if(!d)return;e.preventDefault();starCommit(box,Math.max(0,Math.min(5,r+d)));
});

function toIsbn13(raw){
  raw=String(raw).toUpperCase();
  var i,sum;
  if(/^\d{13}$/.test(raw)){
    if(!/^97[89]/.test(raw))return '';
    sum=0;for(i=0;i<13;i++)sum+=(i%2?3:1)*parseInt(raw.charAt(i),10);
    return sum%10===0?raw:'';
  }
  if(/^\d{9}[\dX]$/.test(raw)){
    sum=0;for(i=0;i<9;i++)sum+=(10-i)*parseInt(raw.charAt(i),10);
    sum+=(raw.charAt(9)==='X'?10:parseInt(raw.charAt(9),10));
    if(sum%11!==0)return '';
    var core='978'+raw.slice(0,9),t=0;for(i=0;i<12;i++)t+=(i%2?3:1)*parseInt(core.charAt(i),10);
    return core+String((10-t%10)%10);
  }
  return '';
}

function photoFromFile(file){
  return new Promise(function(resolve,reject){

        if(side>1024){var m=document.createElement('canvas');m.width=m.height=1024;var mx=m.getContext('2d');mx.imageSmoothingQuality='high';mx.drawImage(im,sx,sy,side,side,0,0,1024,1024);src=m;sx=0;sy=0;side=1024;}

function cleanSynopsis(raw){
  if(raw&&typeof raw==='object')raw=raw.value;

    try{s=new DOMParser().parseFromString(s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n'),'text/html').body.textContent||'';}
    catch(e){s=s.replace(/<[^>]+>/g,' ');}

  s=s.split(/\r?\n\s*(?:Contains:|Also contained in|See also|Source:|\[\d+\]:|Previously published as)/i)[0];
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\[\d+\]/g,'$1').replace(/\(\[source\]\[\d+\]\)/gi,'');
  s=s.replace(/^#+\s*/gm,'').replace(/\*+/g,'').replace(/(^|\s)_+(?=\S)|(\S)_+(?=\s|[.,;:!?]|$)/g,'$1$2');

    var cut=s.slice(0,1200),i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('! '),cut.lastIndexOf('? '));

function afterReview(){

    var p=rv.prev;

function finishBook(fb){

/* ---------- celebration (Finished Reading) ---------- */
var celeb={on:false,t:[],t0:0};
function celebAt(fn,ms){celeb.t.push(setTimeout(fn,ms));}
function celebStop(){
  for(var i=0;i<celeb.t.length;i++)clearTimeout(celeb.t[i]);
  celeb.t=[];celeb.on=false;
  var a=$('#cel'),b=$('#celx');
  if(a&&a.parentNode)a.parentNode.removeChild(a);
  if(b&&b.parentNode)b.parentNode.removeChild(b);
}
function celebBurst(host,x0,y0,o,m){
  var cols=['#FFB500','#42BB37','#00BDF6','#009CC6'],g=800*m.sy;
  for(var i=0;i<44;i++){
    var a=(o.a0+Math.random()*(o.a1-o.a0))*Math.PI/180,v=o.v0+Math.random()*(o.v1-o.v0);
    var vx=Math.cos(a)*v*m.sx,vy=Math.sin(a)*v*m.sy,T=1.7+Math.random()*.7,rot=(Math.random()-.5)*1440,circ=Math.random()<.3;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;left:0;top:0;background:'+cols[i%4]+';width:'+(circ?9:12)+'px;height:'+(circ?9:7)+'px;border-radius:'+(circ?'50%':'1px');
    host.appendChild(e);
    var kf=[];
    for(var j=0;j<=18;j++){
      var t=T*j/18,x=x0+vx*(1-Math.exp(-o.k*t))/o.k,y=y0+vy*t+.5*g*t*t;
      kf.push({offset:j/18,opacity:j/18>.7?1-(j/18-.7)/.3:1,transform:'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(rot*j/18).toFixed(0)+'deg)'});
    }
    e.animate(kf,{duration:T*1000*m.S,delay:Math.random()*100*m.S,fill:'both',easing:'linear'});
  }
}
function celebrate(done){
  if(reduced()||!document.documentElement.animate){done();return;}
  celebStop();
  var S=1.4,W=window.innerWidth,H=window.innerHeight,cw=Math.min(W,480),cl=(W-cw)/2;
  var m={S:S,sx:cw/390,sy:H/700},at=1250*S;
  var host=document.createElement('div');host.id='cel';host.setAttribute('aria-hidden','true');
  var shield=document.createElement('div');shield.id='celx';
  celeb.on=true;celeb.t0=Date.now();
  try{
    document.body.appendChild(host);document.body.appendChild(shield);
    var d=document.createElement('div');d.style.cssText='position:absolute;inset:0;background:rgba(0,3,60,.8)';
    host.appendChild(d);
    d.animate([{opacity:0},{opacity:1}],{duration:200*S,fill:'both'});
    celebAt(function(){d.animate([{opacity:1},{opacity:0}],{duration:300*S,fill:'forwards'});},at);
    var rg=document.createElement('div');
    rg.style.cssText='position:absolute;left:'+(W/2-55)+'px;top:'+(H*.43-55)+'px;width:110px;height:110px';
    rg.innerHTML='<svg viewBox="0 0 110 110" width="110" height="110" aria-hidden="true"><circle class="pu" cx="55" cy="55" r="44" fill="none" stroke="#00BDF6" stroke-width="2" style="transform-box:fill-box;transform-origin:center"/><circle class="rg" cx="55" cy="55" r="44" fill="#00296B" stroke="#00BDF6" stroke-width="3.5" stroke-dasharray="276.5" transform="rotate(-90 55 55)"/><path class="ck" d="M34 57l15 15 28-30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70"/></svg>';
    host.appendChild(rg);
    rg.querySelector('.rg').animate([{strokeDashoffset:276.5},{strokeDashoffset:0}],{duration:450*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.ck').animate([{strokeDashoffset:70},{strokeDashoffset:0}],{duration:300*S,delay:380*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.pu').animate([{transform:'scale(1)',opacity:0},{transform:'scale(1)',opacity:.7,offset:.01},{transform:'scale(1.5)',opacity:0}],{duration:500*S,delay:620*S,easing:'ease-out',fill:'both'});
    rg.animate([{transform:'scale(.85)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260*S,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'both'});
    rg.animate([{opacity:1},{opacity:0}],{duration:250*S,delay:1000*S,fill:'both'});
    var by=H-28*m.sy;
    celebAt(function(){celebBurst(host,cl+16*m.sx,by,{a0:-92,a1:-58,v0:720,v1:1000,k:1.8},m);},620*S);
    celebAt(function(){celebBurst(host,cl+cw-16*m.sx,by,{a0:-122,a1:-88,v0:720,v1:1000,k:1.8},m);},970*S);
  }catch(err){celebStop();done();return;}
  celebAt(function(){
    var x=$('#celx');if(x&&x.parentNode)x.parentNode.removeChild(x);
    celeb.on=false;
    done();
  },at);
  celebAt(function(){var h=$('#cel');if(h&&h.parentNode)h.parentNode.removeChild(h);},3900*S);
}

var CH_KEY='bm_challenge',chLast=null;
function dstr(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(Date.now());}
function okDate(v){
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
  var p=v.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.getFullYear()===+p[0]&&d.getMonth()===+p[1]-1&&d.getDate()===+p[2];
}
function dlabel(v){var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function chClean(x){
  if(!x||typeof x!=='object')return null;
  var t=Math.floor(Number(x.target));
  if(!isFinite(t)||t<1||t>999)return null;
  if(!okDate(x.start)||!okDate(x.end)||x.end<x.start)return null;
  var cr=[];
  if(Array.isArray(x.credits))x.credits.forEach(function(c){
    var b=cleanBook({id:c&&c.id,title:c&&c.title,author:c&&c.author,coverUrl:c&&c.coverUrl,isbn:c&&c.isbn});
    var f=Number(c&&c.finishedAt);
    if(b&&isFinite(f)&&f>0&&!cr.some(function(q){return q.id===b.id;}))cr.push({id:b.id,title:b.title,author:b.author,coverUrl:b.coverUrl||'',isbn:b.isbn||'',finishedAt:Math.floor(f)});
  });
  return {target:t,start:x.start,end:x.end,credits:cr.slice(0,999),complete:!!x.complete,celebrated:!!x.celebrated,created:Number(x.created)||Date.now()};
}
function chGet(){var raw=lsGet(CH_KEY);if(!raw)return null;try{return chClean(JSON.parse(raw));}catch(e){return null;}}
function chSave(c){lsSet(CH_KEY,c?JSON.stringify(c):'');}
function chExpire(){var c=chGet();if(c&&!c.complete&&todayStr()>c.end)chSave(null);}
function chTitle(c){
  var n=c.target,w=n===1?'Book':'Books';
  if(c.start.slice(5)==='01-01'&&c.end.slice(5)==='12-31'&&c.start.slice(0,4)===c.end.slice(0,4))return n+' '+w+' in '+c.end.slice(0,4);
  var d=dlabel(c.end);
  if(c.end.slice(0,4)===String(new Date().getFullYear()))d=d.replace(/,\s*\d{4}$/,'');
  return n+' '+w+' by '+d;
}
function chSnap(b){return {id:b.id,title:b.title,author:b.author||'',coverUrl:b.coverUrl||'',isbn:b.isbn||'',finishedAt:b.finishedAt};}
function chCredit(b){
  var c=chGet();if(!c||c.complete||!b||!b.finishedAt)return null;
  var d=dstr(b.finishedAt);if(d<c.start||d>c.end)return null;
  for(var i=0;i<c.credits.length;i++)if(c.credits[i].id===b.id)return {added:false,completed:false};
  c.credits.push(chSnap(b));
  var done=c.credits.length>=c.target;
  if(done){c.complete=true;c.celebrated=false;}
  chSave(c);
  return {added:true,completed:done};
}
function chUncredit(id,wasComplete){

var ocr={worker:null,making:null,idle:null,onlog:null,token:0,busy:false,shown:0};

}
function ocrWorker(){

function ocrPrep(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2400/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),chh=Math.max(1,Math.round(h*k));
        var c=document.createElement('canvas');c.width=cw;c.height=chh;
        var x=c.getContext('2d');x.drawImage(img,0,0,cw,chh);
        var d=x.getImageData(0,0,cw,chh),p=d.data,hist=new Array(256),i,g;
        for(i=0;i<256;i++)hist[i]=0;
        for(i=0;i<p.length;i+=4){g=Math.round((p[i]*299+p[i+1]*587+p[i+2]*114)/1000);p[i]=p[i+1]=p[i+2]=g;hist[g]++;}
        var total=cw*chh,acc=0,lo=0,hi=255;
        for(i=0;i<256;i++){acc+=hist[i];if(acc>=total*0.01){lo=i;break;}}
        acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>=total*0.01){hi=i;break;}}
        var span=Math.max(90,hi-lo);
        for(i=0;i<p.length;i+=4){g=(p[i]-lo)*255/span;g=g<0?0:(g>255?255:g);p[i]=p[i+1]=p[i+2]=g;}
        x.putImageData(d,0,0);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.92));
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
function ocrTidy(t){
  t=String(t||'').replace(/\r/g,'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'');
  t=t.replace(/([a-z])-\n([a-z])/g,'$1$2');
  t=t.replace(/\n{2,}/g,'\u0001').replace(/\n/g,' ').replace(/\u0001/g,'\n\n');
  return t.replace(/[ \t]+/g,' ').replace(/ ?\n\n ?/g,'\n\n').trim();
}
function scanUI(mode,p,first){
  var box=$('#q-scanbox');if(!box)return;
  var btn=$('#q-scanbtn'),pick=$('#q-pickbtn');
  if(mode==='idle'){box.style.display='none';if(btn)btn.style.display='';if(pick)pick.style.display='';return;}
  box.style.display='block';if(btn)btn.style.display='none';if(pick)pick.style.display='none';
  var t=$('#qs-t'),s=$('#qs-s'),b=$('#qs-b');
  if(mode==='prep'){t.textContent='Getting the reader ready';s.textContent=first?'One time only, about 14 MB. After this it works without waiting.':'Just a moment.';ocr.shown=Math.max(ocr.shown,p||0);b.style.width=ocr.shown+'%';}
  else{t.textContent='Reading the page';s.textContent='This happens on your phone. Nothing is uploaded.';b.style.width=(p||0)+'%';}
}
function scanLabel(){var ta=$('#q-text'),btn=$('#q-scanbtn');if(btn)btn.innerHTML=CAM_ICO+(ta&&ta.value.trim()?'Scan Another Page':'Scan a Page');}

function scanPage(file){
  if(!file||ocr.busy||!$('#q-text'))return;
  var tk=++ocr.token,first=!lsGet('bm_ocr_ready'),dataUrl=null;
  ocr.busy=true;ocr.shown=0;

    if(tk!==ocr.token)return;
    var st=String(m.status||''),pr=Math.round((m.progress||0)*100);
    if(st==='recognizing text')scanUI('read',pr);else scanUI('prep',pr,first);
  };

    if(tk!==ocr.token)throw 'cancel';
    var ta=$('#q-text');if(!ta)throw 'cancel';
    var text=ocrTidy(r&&r.data&&r.data.text),conf=(r&&r.data&&r.data.confidence)||0;
    ocr.busy=false;ocr.onlog=null;scanUI('idle');ocrIdle();

    var cur=ta.value.trim(),joined=cur?cur+' '+text:text,notes=[];
    if(joined.length>2000){joined=joined.slice(0,2000);notes.push('That was long, so only the first 2,000 characters were kept.');}
    if(conf<80)notes.push('This page was hard to read. Please check the text before you save.');

    var n=$('#q-note');if(n){n.textContent=notes.join(' ');n.style.display=notes.length?'block':'none';}
  })
  .catch(function(e){
    if(e==='cancel')return;
    var m=String(e&&e.message||e);
    if(m==='load'||/network|fetch|load/i.test(m))scanFail('The reader could not load. Check your connection, or type the quote.');
    else if(m==='img')scanFail('That photo could not be read. Try another one.');
    else scanFail('The page could not be read. You can still type the quote.');
  });
}

}
function inLib(title){
  var t=anorm(title),t0=anorm(String(title).split(':')[0]);
  for(var i=0;i<state.books.length;i++){
    var b=state.books[i],x=anorm(b.title),x0=anorm(String(b.title).split(':')[0]);
    if(x===t||x0===t||x===t0||(t0&&x0===t0))return b;

function authorNames(s){

    if(out.length&&(/^(jr|sr|ii|iii|iv|phd|md)\.?$/i.test(p)||p.split(/\s+/).length<2))out[out.length-1]+=', '+p;else out.push(p);

function okImg(u){return typeof u==='string'&&u.length<1000&&/^https:\/\/(upload\.wikimedia\.org|thumb\.wikimedia\.org|covers\.openlibrary\.org)\//.test(u);}

function acAll(){try{var o=JSON.parse(lsGet(AC_KEY)||'{}');return(o&&typeof o==='object')?o:{};}catch(e){return {};}}
function acGet(k){var e=acAll()[k];if(!e||typeof e.t!=='number')return null;var d=authClean(e.d);return d?{t:e.t,d:d}:null;}
function acSet(k,d){

function ajget(u){return withTimeout(fetch(u).then(function(r){if(!r.ok)throw new Error('http');return r.json();}),12000);}
var WROLE=/(writer|author|novelist|poet|playwright|dramatist|essayist|journalist|historian|biographer|memoirist|screenwriter|columnist|illustrator|critic|editor|satirist|scholar|philosopher|physician|scientist|theologian|diarist)/i;
function wikiOK(j,name){

function clip(t,n){

var JUNK=/\b(box(ed)? set|boxset|study guide|summary of|sparknotes|cliffsnotes|workbook|coloring book|complete works|collected works|trivia|analysis of)\b/i;
function authBooks(docs){
  var seen={},out=[];
  (docs||[]).forEach(function(d){
    if(out.length>=12||!d||typeof d.title!=='string'||typeof d.key!=='string'||JUNK.test(d.title))return;
    if(Array.isArray(d.language)&&d.language.length&&d.language.indexOf('eng')<0)return;

function authKey(name,title){
  var n=anorm(name),enc=encodeURIComponent;

function authBuild(name,key,works,det,wiki){

function authFetch(name,title){

function authOpen(name){return state.card==='author'&&state.author&&state.author.name===name;}
function authLoad(name,title,force){

/* ----- the rules ----- */
function fts(b){return b.finishedAt||b.updatedAt||b.addedAt||0;}
function shift(s,n){var p=s.split('-');return dstr(new Date(+p[0],+p[1]-1,+p[2]+n).getTime());}
function primary(b){var n=authorNames(b.author)[0];return n?anorm(n):'';}
function evalAll(now){
  var E={},bs=state.books,ch=chGet();
  var fin=bs.filter(function(b){return b.status==='finished';}).sort(function(a,b){return fts(a)-fts(b);});
  function at(v){return v||now;}
  if(fin.length>=1)E.spine=at(fts(fin[0]));
  if(fin.length>=10)E.worm=at(fts(fin[9]));
  if(fin.length>=25)E.bib=at(fts(fin[24]));
  if(fin.length>=50)E.legend=at(fts(fin[49]));
  var pg=0;bs.forEach(function(b){pg+=Math.max(0,b.currentPage||0);});
  if(pg>=5000)E.pages=now;
  var big=fin.filter(function(b){return b.pages>600;});
  if(big.length)E.door=at(fts(big[0]));
  var qk=fin.filter(function(b){var d=(b.finishedAt||0)-(b.startedAt||0);return b.startedAt&&b.finishedAt&&d>=600000&&d<=3*864e5;});
  if(qk.length)E.quick=qk[0].finishedAt;
  var mo={};
  fin.forEach(function(b){if(b.finishedAt&&b.startedAt!==b.finishedAt){var m=dstr(b.finishedAt).slice(0,7);(mo[m]=mo[m]||[]).push(b.finishedAt);}});
  Object.keys(mo).forEach(function(m){var l=mo[m].sort(function(a,b){return a-b;});if(l.length>=3&&(!E.hat||l[2]<E.hat))E.hat=l[2];});
  var seen=Object.create(null),cnt=0,per=Object.create(null);
  fin.forEach(function(b){var k=primary(b);if(!k)return;
    if(!seen[k]){seen[k]=1;cnt++;if(cnt===5)E.round=at(fts(b));}
    per[k]=(per[k]||0)+1;if(per[k]===3&&(!E.fan||fts(b)<E.fan))E.fan=at(fts(b));});
  var ow=bs.filter(function(b){return b.owned!==false;}).sort(function(a,b){return (a.addedAt||0)-(b.addedAt||0);});
  if(ow.length>=100)E.collector=at(ow[99].addedAt);
  var sb=fin.filter(function(b){return b.startedAt&&b.finishedAt&&b.finishedAt-b.startedAt>=30*864e5;});
  if(sb.length)E.slow=at(sb[0].finishedAt);
  var rv=bs.filter(function(b){return typeof b.review==='string'&&b.review.trim();}).sort(function(a,b){return (a.updatedAt||0)-(b.updatedAt||0);});
  if(rv.length>=5)E.critic=at(rv[4].updatedAt);
  var qs=[];bs.forEach(function(b){(b.quotes||[]).forEach(function(q){qs.push(q.at||0);});});
  qs.sort(function(a,b){return a-b;});
  if(qs.length>=10)E.quote=at(qs[9]);
  if(ch){
    E.accept=at(ch.created);
    if(ch.target>=24)E.dream=at(ch.created);
    if(ch.complete){var last=0;ch.credits.forEach(function(c){if(c.finishedAt>last)last=c.finishedAt;});
      E.champ=at(last);if(last&&dstr(last)<=shift(ch.end,-30))E.early=last;}
  }
  if(S){
    if(S.owl.length>=5)E.owl=now;
    if(S.bird.length>=5)E.bird=now;
    for(var k2 in S.pages){if(S.pages[k2]>=200){E.mara=now;break;}}
  }
  return E;
}

/* ----- earning ----- */
function dotSync(){var d=document.querySelector('.bgdot');if(d)d.hidden=!(S&&S.fresh.length>0);}
function migrate21(){
  var f=null;try{f=localStorage.getItem('bm_bgmig21');}catch(e){}
  if(f==='1')return;
  var E=evalAll(Date.now()),ch=false;
  ['collector','slow'].forEach(function(id){if(E[id]&&!S.earned[id]){S.earned[id]=E[id];ch=true;}});
  if(ch)save();
  try{localStorage.setItem('bm_bgmig21','1');}catch(e){}
}
function init(){
  S=load();
  if(!S){S=blank();catchUp();}
  migrate21();
  dotSync();
}
function catchUp(){
  if(!S)return;var now=Date.now(),E=evalAll(now),ch=false;
  DEFS.forEach(function(d){if(E[d.id]&&!S.earned[d.id]){S.earned[d.id]=E[d.id];ch=true;}});
  if(ch)save();
}
function check(){
  if(!S)return [];
  var now=Date.now(),E=evalAll(now),ids=[];
  DEFS.forEach(function(d){if(E[d.id]&&!S.earned[d.id]){S.earned[d.id]=now;S.fresh.push(d.id);ids.push(d.id);}});
  if(ids.length){save();Q=Q.concat(ids);dotSync();tryN=0;tryShow();}
  return ids;
}
function undo(ids){
  if(!S||!ids||!ids.length)return;
  var E=evalAll(Date.now()),ch=false;
  ids.forEach(function(id){if(!E[id]&&S.earned[id]){delete S.earned[id];ch=true;}});
  S.fresh=S.fresh.filter(function(id){return !!S.earned[id];});
  Q=Q.filter(function(id){return !!S.earned[id];});
  if(pop){popIds=popIds.filter(function(id){return !!S.earned[id];});if(!popIds.length)popClose();else{if(popI>=popIds.length)popI=popIds.length-1;popRender();}}
  if(ch)save();dotSync();
}
function slotFor(d){var h=d.getHours();if(h>=22||h<4)return 'owl';if(h>=4&&h<7)return 'bird';return '';}
function logProgress(oldP,newP){
  if(!S||!(newP>oldP))return;
  var d=new Date(),k=slotFor(d),dirty=false,t;
  if(k&&!S.earned[k]){
    t=new Date(d.getTime());if(k==='owl'&&t.getHours()<4)t.setDate(t.getDate()-1);
    var key=dstr(t.getTime());
    if(S[k].indexOf(key)<0){S[k].push(key);S[k]=S[k].sort().slice(-60);dirty=true;}
  }
  var delta=newP-oldP;
  if(!S.earned.mara&&delta<=5000){var day=dstr(d.getTime());S.pages[day]=Math.min(99999,(S.pages[day]||0)+delta);var ks=Object.keys(S.pages).sort();while(ks.length>60){delete S.pages[ks.shift()];}dirty=true;}
  if(dirty)save();
}
function exportData(){return S?{v:1,earned:S.earned,owl:S.owl,bird:S.bird,pages:S.pages}:null;}
function merge(o){
  if(!o||!S)return;
  DEFS.forEach(function(d){var t=o.earned[d.id];if(t&&(!S.earned[d.id]||t<S.earned[d.id]))S.earned[d.id]=t;});
  ['owl','bird'].forEach(function(k){o[k].forEach(function(v){if(S[k].indexOf(v)<0)S[k].push(v);});S[k]=S[k].sort().slice(-60);});
  Object.keys(o.pages).forEach(function(k){if(!(S.pages[k]>=o.pages[k]))S.pages[k]=o.pages[k];});
  save();
}

/* ----- the Badges page ----- */
function nav(v){
  if(v==='badges'&&S){shown=S.fresh.slice();if(S.fresh.length){S.fresh=[];save();}}
  else if(v!=='badges'){shown=[];}
  dotSync();
}
function cell(d,e){
  var isNew=e&&shown.indexOf(d.id)>=0,when=e?fmtDate(S.earned[d.id]):'';
  return '<button class="bgc" data-act="bgopen" data-bgid="'+d.id+'" aria-label="'+esc(d.n)+(e?', earned '+esc(when):', not yet earned')+'">'+badgeHTML(d,88,e?'e':'u')+'<span class="bgnm">'+esc(d.n)+'</span>'+(e?'<span class="bgsub">'+esc(when)+'</span>':'')+(isNew?'<span class="bgnw">NEW</span>':'')+'</button>';
}
function grid(list,e){return '<div class="bgg">'+list.map(function(d){return cell(d,e);}).join('')+'</div>';}
function view(){
  var er=[],rest=[];
  DEFS.forEach(function(d){(S&&S.earned[d.id]?er:rest).push(d);});
  er.sort(function(a,b){return S.earned[b.id]-S.earned[a.id];});
  var n=er.length,N=DEFS.length,p=Math.round(n/N*100);
  var h=ptitle('Badges')+'<div class="cd" style="margin-top:14px"><div style="font-size:18px;font-weight:500" id="bgsum">'+n+' of '+N+' Earned</div><div class="bar" style="height:6px;margin:8px 0 0"><b style="width:'+p+'%"></b></div><div class="sm" style="margin-top:8px">'+(rest.length?rest.length+' More to Discover':'You have earned every badge!')+'</div></div>';
  h+='<h2 class="sec">Earned<span class="bgn">'+n+'</span></h2>';
  h+=n?grid(er,true):'<div class="cd msgp"><p class="sm" style="margin:0">Finish a book and your first badge lands here.</p></div>';
  if(rest.length)h+='<h2 class="sec">Still to Earn<span class="bgn">'+rest.length+'</span></h2>'+grid(rest,false);
  return h;
}
function sheetHTML(d,e){
  var h='<div class="bgstage">'+badgeHTML(d,134,e?'e':'u')+'</div><h2 style="text-align:center;margin:12px 0 6px">'+esc(d.n)+'</h2><p class="lb" style="margin:0">'+(e?'Earned By':'How to Earn It')+'</p><p style="font-size:15px;margin:2px 0 12px">'+(e?esc(d.r):'It is a mystery. Keep reading and you will find out.')+'</p>';
  if(e)h+='<div class="bgok"><svg class="tb" width="20" height="20" aria-hidden="true"><use href="#i-check"/></svg>Earned '+esc(fmtDate(S.earned[d.id]))+'</div><button class="ob" data-act="bgreplay" style="margin-top:14px">Replay the Unlock</button>';
  return h;
}
function open(id){
  var d=def(id);if(!d||!S)return;var e=!!S.earned[id];
  openSheet(sheetHTML(d,e));
  if(e){var root=document.querySelector('#layer .bgstage');tilt(root);setTimeout(function(){rise(document.querySelector('#layer .bgstage'),0);},reduced()?0:320);}
}
function replay(){rise(document.querySelector('#layer .bgstage'),0);}

/* ----- the new-badge pop-up ----- */
function blocked(){return (typeof celeb!=='undefined'&&celeb.on)||!!document.querySelector('#layer .ov:not(.out)')||!!document.getElementById('wl')||!!document.querySelector('#bgpop.out')||document.hidden;}
function tryShow(){
  clearTimeout(tryT);if(!Q.length)return;
  if(pop){popIds=popIds.concat(Q.splice(0));popRender();return;}
  if(blocked()&&tryN<60){tryN++;tryT=setTimeout(tryShow,500);return;}
  tryN=0;popOpen(Q.splice(0));
}
function popOpen(ids){
  popIds=ids.slice();popI=0;
  pop=document.createElement('div');pop.id='bgpop';pop.setAttribute('role','dialog');pop.setAttribute('aria-modal','true');pop.setAttribute('aria-label','New badge');
  pop.innerHTML='<div class="bgpc" id="bgpc"></div>';
  document.body.appendChild(pop);
  if(!document.body.classList.contains('noscroll')){document.body.classList.add('noscroll');lockedBody=true;}
  pop.addEventListener('click',function(e){if(e.target===pop)popClose();});
  popRender();
}
function sparks(host){
  if(reduced()||!host.animate)return;
  var cs=['#FFB500','#42BB37','#00BDF6','#FFF3D6','#E8604C'],n=16,i;
  for(i=0;i<n;i++){var s=document.createElement('span');s.className='bgsp';s.style.background=cs[i%5];host.appendChild(s);
    var a=Math.PI*2*i/n+(i%2?.2:0),r=84+((i*13)%34);
    an(s,[{transform:'translate(0,0) scale(.4)',opacity:1},{transform:'translate('+(Math.cos(a)*r)+'px,'+(Math.sin(a)*r)+'px) scale(1)',opacity:1,offset:.6},{transform:'translate('+(Math.cos(a)*(r+14))+'px,'+(Math.sin(a)*(r+14)+10)+'px) scale(.2)',opacity:0}],{duration:1000,delay:i*12,easing:'cubic-bezier(.2,.7,.3,1)'});}
}
function popRender(){
  var c=document.getElementById('bgpc');if(!c||!popIds.length)return;
  var d=def(popIds[popI]),last=popI===popIds.length-1,many=popIds.length>1;
  popT.forEach(clearTimeout);popT=[];
  c.style.animation='none';void c.offsetWidth;c.style.animation='';
  var h='<p class="bgpk">'+(many?'New badge '+(popI+1)+' of '+popIds.length:'New badge')+'</p><div class="bgpstage" id="bgpstage">'+badgeHTML(d,150,'e')+'</div><div class="bgpn" id="bgpn">'+esc(d.n)+'</div><p class="bgpr">'+esc(d.r)+'</p>';
  if(many){h+='<div class="bgpd" aria-hidden="true">';popIds.forEach(function(x,i){h+='<i'+(i===popI?' class="on"':'')+'></i>';});h+='</div>';}
  h+='<button class="pb" id="bgp1">'+(last?'Done':'Next')+'</button>'+(last?'<button class="ob" id="bgp2" style="margin-top:8px">See all badges</button>':'');
  c.innerHTML=h;
  var st=document.getElementById('bgpstage');
  document.getElementById('bgp1').onclick=function(){if(last)popClose();else{popI++;popRender();}};
  var b2=document.getElementById('bgp2');if(b2)b2.onclick=function(){popClose();go('badges');};
  tilt(st);
  if(!reduced()){popT.push(setTimeout(function(){rise(st,0);},320));popT.push(setTimeout(function(){sparks(st);},320+riseMs(st)));}
  try{document.getElementById('bgp1').focus({preventScroll:true});}catch(e){}
}
function popClose(){
  popT.forEach(clearTimeout);popT=[];
  var p=pop;pop=null;popIds=[];popI=0;
  if(p&&p.parentNode)p.parentNode.removeChild(p);
  if(lockedBody){document.body.classList.remove('noscroll');lockedBody=false;}
  if(Q.length){tryN=0;tryShow();}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&pop){e.preventDefault();popClose();}});
return {defs:DEFS,init:init,check:check,catchUp:catchUp,undo:undo,logProgress:logProgress,exportData:exportData,merge:merge,clean:clean,nav:nav,view:view,open:open,replay:replay,html:badgeHTML,evalAll:function(){return evalAll(Date.now());},get:function(){return S;},popOpen:function(){return !!pop;}};

})();

/* ---------- start ---------- */
function start(){
  try{localStorage.removeItem('bm_topstrip');}catch(e){}
  render();
  navH();
  welcome();
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
  openDB().then(function(d){db=d;return dbAll();}).then(function(rows){state.books=rows;state.loaded=true;BGX.init();render();})
  .catch(function(){memoryOnly=true;state.loaded=true;BGX.init();render();toast('This browser mode can\'t save books');});
}
start();
checkUpdate();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkUpdate();});
window.__bm={bg:BGX,lookup:doLookup,clean:cleanSynopsis,add:function(title,status,pages,author,owned){state.addAs=status||'toread';state.addOwned=owned!==false;makeBook({title:title,author:author||'',pages:pages||0});}};
})();
</script>
