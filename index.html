<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001F5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookmark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Bookmark scan test</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #001F5F;
    --surface: #00296B;
    --line: #00478E;
    --text: #FFFFFF;
    --muted: #C4C7C7;
    --accent: #00BDF6;
    --danger: #FFB500;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 440px; margin: 0 auto; }
  h1.logo { margin: 0 0 8px; line-height: 0; }
  h1.logo > svg { height: 40px; width: auto; display: block; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  #reader {
    width: 100%;
    background: #00033C;
    border-radius: 14px;
    overflow: hidden;
    border: 0;
  }
  #reader video { border-radius: 14px; }
  .actions { display: flex; gap: 8px; margin: 14px 0 0; }
  button {
    font: inherit;
    font-size: 15px;
    border-radius: 12px;
    padding: 13px 16px;
    border: 0.5px solid #00478E;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #00033C; border-color: var(--accent); flex: 1; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 24px; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  #status.error { color: var(--danger); }
  #result {
    margin-top: 16px;
    background: var(--surface);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  #result[hidden], button[hidden] { display: none; }
  #cover {
    width: 84px;
    min-height: 126px;
    flex: none;
    border-radius: 4px;
    background: #00478E;
    object-fit: cover;
  }
  #cover[hidden] { display: none; }
  .meta { min-width: 0; }
  .meta .t { font-size: 17px; margin: 0; }
  .meta .a { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .meta .d { color: var(--muted); font-size: 13px; margin: 0; }
  details { margin-top: 22px; border-top: 0.5px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .manual { display: flex; gap: 8px; margin-top: 12px; }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    padding: 12px;
    border-radius: 12px;
    border: 0.5px solid #00478E;
    background: var(--surface);
    color: var(--text);
  }
  .env { margin-top: 22px; font-size: 12px; color: #C4C7C7; }
</style>
</head>
<body>
<main>
  <h1 class="logo"><svg viewBox="0 0 140 28" width="140" height="28" role="img" aria-label="Bookmark"><svg x="0" y="1" width="28" height="26" viewBox="22 24 56 52"><rect x="26" y="33.5" width="9" height="36" rx="1.5" fill="#FFB500"/><rect x="39" y="25.5" width="9" height="44" rx="1.5" fill="#42BB37"/><rect x="52" y="37.5" width="9" height="32" rx="1.5" fill="#00BDF6"/><rect x="65" y="29.5" width="9" height="40" rx="1.5" fill="#009CC6"/><rect x="23" y="71.5" width="54" height="3" rx="1.5" fill="#F0D9B2"/></svg><path transform="translate(38 21.9) scale(0.022)" d="M155 0V-100H356Q409 -100 438.0 -133.0Q467 -166 467 -209Q467 -238 454.0 -263.0Q441 -288 416.0 -303.0Q391 -318 356 -318H155V-418H339Q384 -418 411.0 -441.0Q438 -464 438 -509Q438 -554 411.0 -577.0Q384 -600 339 -600H155V-700H342Q413 -700 460.0 -674.0Q507 -648 530.0 -607.0Q553 -566 553 -519Q553 -464 522.5 -422.0Q492 -380 433 -354L442 -390Q508 -363 545.0 -314.0Q582 -265 582 -199Q582 -145 555.5 -100.0Q529 -55 477.5 -27.5Q426 0 351 0ZM76 0V-700H191V0Z M903 10Q833 10 776.0 -23.5Q719 -57 685.5 -114.0Q652 -171 652 -241Q652 -311 685.5 -367.0Q719 -423 776.0 -456.5Q833 -490 903 -490Q974 -490 1031.0 -457.0Q1088 -424 1121.5 -367.5Q1155 -311 1155 -241Q1155 -171 1121.5 -114.0Q1088 -57 1031.0 -23.5Q974 10 903 10ZM903 -96Q944 -96 975.5 -114.5Q1007 -133 1024.5 -166.0Q1042 -199 1042 -241Q1042 -283 1024.0 -315.0Q1006 -347 975.0 -365.5Q944 -384 903 -384Q863 -384 831.5 -365.5Q800 -347 782.5 -315.0Q765 -283 765 -241Q765 -199 782.5 -166.0Q800 -133 831.5 -114.5Q863 -96 903 -96Z M1466 10Q1396 10 1339.0 -23.5Q1282 -57 1248.5 -114.0Q1215 -171 1215 -241Q1215 -311 1248.5 -367.0Q1282 -423 1339.0 -456.5Q1396 -490 1466 -490Q1537 -490 1594.0 -457.0Q1651 -424 1684.5 -367.5Q1718 -311 1718 -241Q1718 -171 1684.5 -114.0Q1651 -57 1594.0 -23.5Q1537 10 1466 10ZM1466 -96Q1507 -96 1538.5 -114.5Q1570 -133 1587.5 -166.0Q1605 -199 1605 -241Q1605 -283 1587.0 -315.0Q1569 -347 1538.0 -365.5Q1507 -384 1466 -384Q1426 -384 1394.5 -365.5Q1363 -347 1345.5 -315.0Q1328 -283 1328 -241Q1328 -199 1345.5 -166.0Q1363 -133 1394.5 -114.5Q1426 -96 1466 -96Z M2114 0 1911 -245 2113 -480H2244L2012 -216L2017 -279L2254 0ZM1809 0V-720H1919V0Z M2304 0V-480H2414V0ZM2623 0V-286Q2623 -334 2593.0 -360.5Q2563 -387 2519 -387Q2489 -387 2465.5 -375.0Q2442 -363 2428.0 -340.5Q2414 -318 2414 -286L2371 -310Q2371 -365 2395.0 -405.0Q2419 -445 2460.0 -467.5Q2501 -490 2552 -490Q2603 -490 2644.0 -468.0Q2685 -446 2709.0 -406.0Q2733 -366 2733 -310V0ZM2942 0V-286Q2942 -334 2912.0 -360.5Q2882 -387 2838 -387Q2809 -387 2785.0 -375.0Q2761 -363 2747.0 -340.5Q2733 -318 2733 -286L2671 -310Q2676 -365 2703.0 -405.0Q2730 -445 2772.5 -467.5Q2815 -490 2866 -490Q2918 -490 2960.0 -468.0Q3002 -446 3027.0 -406.0Q3052 -366 3052 -310V0Z M3366 10Q3301 10 3248.5 -23.0Q3196 -56 3165.5 -112.5Q3135 -169 3135 -239Q3135 -310 3165.5 -366.5Q3196 -423 3248.5 -456.5Q3301 -490 3366 -490Q3421 -490 3463.5 -466.5Q3506 -443 3531.0 -402.0Q3556 -361 3556 -309V-171Q3556 -119 3531.5 -78.0Q3507 -37 3464.0 -13.5Q3421 10 3366 10ZM3384 -94Q3445 -94 3482.5 -135.0Q3520 -176 3520 -240Q3520 -283 3503.0 -316.0Q3486 -349 3455.5 -367.5Q3425 -386 3384 -386Q3344 -386 3313.5 -367.5Q3283 -349 3265.5 -316.0Q3248 -283 3248 -240Q3248 -197 3265.5 -164.0Q3283 -131 3313.5 -112.5Q3344 -94 3384 -94ZM3513 0V-129L3532 -246L3513 -362V-480H3623V0Z M3745 0V-480H3855V0ZM3855 -267 3817 -286Q3817 -377 3857.5 -433.5Q3898 -490 3980 -490Q4016 -490 4045.0 -477.0Q4074 -464 4099 -435L4027 -361Q4014 -375 3998.0 -381.0Q3982 -387 3961 -387Q3915 -387 3885.0 -358.0Q3855 -329 3855 -267Z M4457 0 4254 -245 4456 -480H4587L4355 -216L4360 -279L4597 0ZM4152 0V-720H4262V0Z" fill="#F0D9B2"/></svg></h1>
  <p class="sub">Scan test. Point your camera at the barcode on the back of a book.</p>

  <div id="reader"></div>

  <div class="actions">
    <button id="start" class="primary" type="button">Start Scanning</button>
    <button id="stop" type="button" hidden>Stop</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <img id="cover" alt="" hidden>
    <div class="meta">
      <p class="t" id="title"></p>
      <p class="a" id="authors"></p>
      <p class="d" id="details"></p>
      <p class="d" id="isbn"></p>
    </div>
  </section>

  <details>
    <summary>No Camera? Look Up a Book by ISBN</summary>
    <div class="manual">
      <input id="manual" type="text" inputmode="numeric" placeholder="9780000000000" autocomplete="off">
      <button id="lookup" type="button">Look Up</button>
    </div>
  </details>

  <p class="env" id="env"></p>
</main>

<script>
(function () {
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var coverEl = document.getElementById('cover');
  var scanner = null;
  var handled = false;

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = isError ? 'error' : '';
  }

  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  document.getElementById('env').textContent =
    'Opened as: ' + (standalone ? 'Home Screen app' : 'browser tab') +
    '. Built-in barcode reader: ' + ('BarcodeDetector' in window ? 'available' : 'not available') + '.';

  function cleanIsbn(s) { return String(s).replace(/[^0-9Xx]/g, ''); }
  function isBookIsbn(s) { return /^97[89][0-9]{10}$/.test(s); }

  function lookupOpenLibrary(isbn) {
    var url = 'https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data';
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var b = j['ISBN:' + isbn];
      if (!b) return null;
      return {
        title: b.title || '',
        authors: (b.authors || []).map(function (a) { return a.name; }).join(', '),
        pages: b.number_of_pages || '',
        year: b.publish_date || '',
        cover: b.cover ? (b.cover.medium || b.cover.large || b.cover.small || '') : '',
        source: 'Open Library'
      };
    });
  }

  function lookupGoogle(isbn) {
    var url = 'https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn;
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var v = j.items && j.items[0] && j.items[0].volumeInfo;
      if (!v) return null;
      var img = v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || '') : '';
      return {
        title: v.title || '',
        authors: (v.authors || []).join(', '),
        pages: v.pageCount || '',
        year: v.publishedDate || '',
        cover: img.replace('http://', 'https://'),
        source: 'Google Books'
      };
    });
  }

  function findBook(isbn) {
    return lookupOpenLibrary(isbn).catch(function () { return null; }).then(function (book) {
      if (book) return book;
      return lookupGoogle(isbn).catch(function () { return null; });
    });
  }

  function showBook(isbn, book) {
    resultEl.hidden = false;
    document.getElementById('isbn').textContent = 'ISBN ' + isbn;
    if (!book) {
      document.getElementById('title').textContent = 'No match found';
      document.getElementById('authors').textContent = '';
      document.getElementById('details').textContent = 'Neither Open Library nor Google Books has this ISBN. Bookmark will let you add it by hand.';
      coverEl.hidden = true;
      return;
    }
    document.getElementById('title').textContent = book.title;
    document.getElementById('authors').textContent = book.authors;
    var bits = [];
    if (book.pages) bits.push(book.pages + ' pages');
    if (book.year) bits.push(book.year);
    bits.push('from ' + book.source);
    document.getElementById('details').textContent = bits.join(' \u00B7 ');
    if (book.cover) {
      coverEl.src = book.cover;
      coverEl.alt = 'Cover of ' + book.title;
      coverEl.hidden = false;
    } else {
      coverEl.hidden = true;
    }
  }

  function handleIsbn(isbn) {
    setStatus('Found ISBN ' + isbn + '. Looking up the book\u2026');
    resultEl.hidden = true;
    findBook(isbn).then(function (book) {
      showBook(isbn, book);
      setStatus(book ? 'Scan worked.' : 'Scan worked, but the book was not found online.');
    });
  }

  function stopScanner() {
    stopBtn.hidden = true;
    startBtn.hidden = false;
    if (!scanner) return Promise.resolve();
    var s = scanner;
    scanner = null;
    return s.stop().catch(function () {}).then(function () { try { s.clear(); } catch (e) {} });
  }

  function onScan(text) {
    if (handled) return;
    var code = cleanIsbn(text);
    if (!isBookIsbn(code)) {
      setStatus('Saw barcode ' + code + ', but it is not a book ISBN. Try the barcode that starts with 978 or 979.');
      return;
    }
    handled = true;
    if (navigator.vibrate) navigator.vibrate(60);
    stopScanner().then(function () { handleIsbn(code); });
  }

  function startScanner() {
    handled = false;
    resultEl.hidden = true;
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('The scanning library did not load. Check your connection and reload the page.', true);
      return;
    }
    setStatus('Starting the camera\u2026');
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A
      ],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 130 } },
      onScan,
      function () {}
    ).then(function () {
      startBtn.hidden = true;
      stopBtn.hidden = false;
      setStatus('Hold the barcode inside the box. Good light helps.');
    }).catch(function (err) {
      scanner = null;
      var name = err && err.name ? err.name : '';
      var msg = String(err);
      if (name === 'NotAllowedError' || /Permission/i.test(msg)) {
        setStatus('Camera access was blocked. Reload the page and choose Allow when asked.', true);
      } else if (name === 'NotFoundError' || /Requested device not found/i.test(msg)) {
        setStatus('No camera was found on this device.', true);
      } else {
        setStatus('The camera did not start: ' + msg, true);
      }
    });
  }

  startBtn.addEventListener('click', startScanner);
  stopBtn.addEventListener('click', function () { stopScanner(); setStatus('Stopped.'); });

  document.getElementById('lookup').addEventListener('click', function () {
    var code = cleanIsbn(document.getElementById('manual').value);
    if (!isBookIsbn(code)) {
      setStatus('Enter a 13-digit ISBN that starts with 978 or 979.', true);
      return;
    }
    handleIsbn(code);
  });
})();
</script>
</body>
</html>
