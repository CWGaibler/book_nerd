function isbn13to10(i){
  if(!/^978[0-9]{10}$/.test(i))return null;
  var core=i.slice(3,12),s=0;
  for(var k=0;k<9;k++)s+=(10-k)*parseInt(core.charAt(k),10);
  var c=(11-s%11)%11;
  return core+(c===10?'X':String(c));
}

    return d?base+'dp/'+d:base+'s?k='+encodeURIComponent(b.isbn)+'&i=stripbooks';

var PARTS=['van','von','de','del','della','di','da','du','der','den','le','la','el','al','bin','ibn','st','saint'];
function sNorm(t){return String(t||'').normalize?String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim():String(t||'').toLowerCase().trim();}
function authorSortKey(b){
  var n=(authorNames(b.author||'')[0]||'').trim();if(!n)return '';
  var t=n.split(/[\s,]+/).filter(Boolean);
  while(t.length>1&&/^(jr|sr|ii|iii|iv|v|phd|md|esq)\.?$/i.test(t[t.length-1]))t.pop();
  var last=t.pop()||'',first=t.join(' ');
  while(t.length&&PARTS.indexOf(sNorm(t[t.length-1]).replace(/\./g,''))>=0){last=t.pop()+' '+last;}
  return sNorm(last)+'|'+sNorm(t.join(' ')||first);
}
function titleSortKey(b){return sNorm(b.title).replace(/^(the|a|an)\s+/,'');}
function cmpS(a,b){return a<b?-1:(a>b?1:0);}
function sortCmp(k){
  return function(a,b){
    var r=0;
    if(k==='old')r=(a.addedAt||0)-(b.addedAt||0);
    else if(k==='title')r=cmpS(titleSortKey(a),titleSortKey(b));
    else if(k==='author'){var x=authorSortKey(a),y=authorSortKey(b);if(!x&&y)return 1;if(x&&!y)return -1;r=cmpS(x,y);}
    else if(k==='rating'){var ra=a.rating||0,rb=b.rating||0;if(!ra&&rb)return 1;if(ra&&!rb)return -1;r=rb-ra;}
    else if(k==='fin'){var fa=a.finishedAt||0,fb=b.finishedAt||0;if(!fa&&fb)return 1;if(fa&&!fb)return -1;r=fb-fa;}
    if(r)return r;

    return r||((b.addedAt||0)-(a.addedAt||0));
  };
}

var starG=null;
document.addEventListener('pointerdown',function(e){
  var box=e.target.closest?e.target.closest('.stars[data-rate]'):null;if(!box)return;

function cleanSynopsis(raw){

    rating:(function(v){v=Number(v);return isFinite(v)&&v>0?Math.min(5,Math.round(v*2)/2):0;})(x.rating),notes:typeof x.notes==='string'?x.notes.slice(0,20000):'',
    addedAt:num(x.addedAt)||now,updatedAt:num(x.updatedAt)||now};

/* ---------- celebration (Finished Reading) ---------- */
var celeb={on:false,t:[],t0:0};
function celebAt(fn,ms){celeb.t.push(setTimeout(fn,ms));}
function celebStop(){
  for(var i=0;i<celeb.t.length;i++)clearTimeout(celeb.t[i]);
  celeb.t=[];celeb.on=false;
  var a=$('#cel'),b=$('#celx');
  if(a&&a.parentNode)a.parentNode.removeChild(a);
  if(b&&b.parentNode)b.parentNode.removeChild(b);
}
function celebBurst(host,x0,y0,o,m){
  var cols=['#FFB500','#42BB37','#00BDF6','#009CC6'],g=800*m.sy;
  for(var i=0;i<44;i++){
    var a=(o.a0+Math.random()*(o.a1-o.a0))*Math.PI/180,v=o.v0+Math.random()*(o.v1-o.v0);
    var vx=Math.cos(a)*v*m.sx,vy=Math.sin(a)*v*m.sy,T=1.7+Math.random()*.7,rot=(Math.random()-.5)*1440,circ=Math.random()<.3;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;left:0;top:0;background:'+cols[i%4]+';width:'+(circ?9:12)+'px;height:'+(circ?9:7)+'px;border-radius:'+(circ?'50%':'1px');
    host.appendChild(e);
    var kf=[];
    for(var j=0;j<=18;j++){
      var t=T*j/18,x=x0+vx*(1-Math.exp(-o.k*t))/o.k,y=y0+vy*t+.5*g*t*t;
      kf.push({offset:j/18,opacity:j/18>.7?1-(j/18-.7)/.3:1,transform:'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(rot*j/18).toFixed(0)+'deg)'});
    }
    e.animate(kf,{duration:T*1000*m.S,delay:Math.random()*100*m.S,fill:'both',easing:'linear'});
  }
}
function celebrate(done){
  if(reduced()||!document.documentElement.animate){done();return;}
  celebStop();
  var S=1.4,W=window.innerWidth,H=window.innerHeight,cw=Math.min(W,480),cl=(W-cw)/2;
  var m={S:S,sx:cw/390,sy:H/700},at=1250*S;
  var host=document.createElement('div');host.id='cel';host.setAttribute('aria-hidden','true');
  var shield=document.createElement('div');shield.id='celx';
  celeb.on=true;celeb.t0=Date.now();
  try{
    document.body.appendChild(host);document.body.appendChild(shield);
    var d=document.createElement('div');d.style.cssText='position:absolute;inset:0;background:rgba(0,3,60,.8)';
    host.appendChild(d);
    d.animate([{opacity:0},{opacity:1}],{duration:200*S,fill:'both'});
    celebAt(function(){d.animate([{opacity:1},{opacity:0}],{duration:300*S,fill:'forwards'});},at);
    var rg=document.createElement('div');
    rg.style.cssText='position:absolute;left:'+(W/2-55)+'px;top:'+(H*.43-55)+'px;width:110px;height:110px';
    rg.innerHTML='<svg viewBox="0 0 110 110" width="110" height="110" aria-hidden="true"><circle class="pu" cx="55" cy="55" r="44" fill="none" stroke="#00BDF6" stroke-width="2" style="transform-box:fill-box;transform-origin:center"/><circle class="rg" cx="55" cy="55" r="44" fill="#00296B" stroke="#00BDF6" stroke-width="3.5" stroke-dasharray="276.5" transform="rotate(-90 55 55)"/><path class="ck" d="M34 57l15 15 28-30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70"/></svg>';
    host.appendChild(rg);
    rg.querySelector('.rg').animate([{strokeDashoffset:276.5},{strokeDashoffset:0}],{duration:450*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.ck').animate([{strokeDashoffset:70},{strokeDashoffset:0}],{duration:300*S,delay:380*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.pu').animate([{transform:'scale(1)',opacity:0},{transform:'scale(1)',opacity:.7,offset:.01},{transform:'scale(1.5)',opacity:0}],{duration:500*S,delay:620*S,easing:'ease-out',fill:'both'});
    rg.animate([{transform:'scale(.85)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260*S,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'both'});
    rg.animate([{opacity:1},{opacity:0}],{duration:250*S,delay:1000*S,fill:'both'});
    var by=H-28*m.sy;
    celebAt(function(){celebBurst(host,cl+16*m.sx,by,{a0:-92,a1:-58,v0:720,v1:1000,k:1.8},m);},620*S);
    celebAt(function(){celebBurst(host,cl+cw-16*m.sx,by,{a0:-122,a1:-88,v0:720,v1:1000,k:1.8},m);},970*S);
  }catch(err){celebStop();done();return;}
  celebAt(function(){
    var x=$('#celx');if(x&&x.parentNode)x.parentNode.removeChild(x);
    celeb.on=false;
    done();
  },at);
  celebAt(function(){var h=$('#cel');if(h&&h.parentNode)h.parentNode.removeChild(h);},3900*S);
}

var CH_KEY='bm_challenge',chLast=null;
function dstr(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(Date.now());}
function okDate(v){
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
  var p=v.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.getFullYear()===+p[0]&&d.getMonth()===+p[1]-1&&d.getDate()===+p[2];
}
function dlabel(v){var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function chClean(x){
  if(!x||typeof x!=='object')return null;
  var t=Math.floor(Number(x.target));
  if(!isFinite(t)||t<1||t>999)return null;
  if(!okDate(x.start)||!okDate(x.end)||x.end<x.start)return null;
  var cr=[];
  if(Array.isArray(x.credits))x.credits.forEach(function(c){
    var b=cleanBook({id:c&&c.id,title:c&&c.title,author:c&&c.author,coverUrl:c&&c.coverUrl,isbn:c&&c.isbn});
    var f=Number(c&&c.finishedAt);
    if(b&&isFinite(f)&&f>0&&!cr.some(function(q){return q.id===b.id;}))cr.push({id:b.id,title:b.title,author:b.author,coverUrl:b.coverUrl||'',isbn:b.isbn||'',finishedAt:Math.floor(f)});
  });
  return {target:t,start:x.start,end:x.end,credits:cr.slice(0,999),complete:!!x.complete,celebrated:!!x.celebrated,created:Number(x.created)||Date.now()};
}
function chGet(){var raw=lsGet(CH_KEY);if(!raw)return null;try{return chClean(JSON.parse(raw));}catch(e){return null;}}
function chSave(c){lsSet(CH_KEY,c?JSON.stringify(c):'');}
function chExpire(){var c=chGet();if(c&&!c.complete&&todayStr()>c.end)chSave(null);}
function chTitle(c){
  var n=c.target,w=n===1?'Book':'Books';
  if(c.start.slice(5)==='01-01'&&c.end.slice(5)==='12-31'&&c.start.slice(0,4)===c.end.slice(0,4))return n+' '+w+' in '+c.end.slice(0,4);
  var d=dlabel(c.end);
  if(c.end.slice(0,4)===String(new Date().getFullYear()))d=d.replace(/,\s*\d{4}$/,'');
  return n+' '+w+' by '+d;
}
function chSnap(b){return {id:b.id,title:b.title,author:b.author||'',coverUrl:b.coverUrl||'',isbn:b.isbn||'',finishedAt:b.finishedAt};}
function chCredit(b){
  var c=chGet();if(!c||c.complete||!b||!b.finishedAt)return null;
  var d=dstr(b.finishedAt);if(d<c.start||d>c.end)return null;
  for(var i=0;i<c.credits.length;i++)if(c.credits[i].id===b.id)return {added:false,completed:false};
  c.credits.push(chSnap(b));
  var done=c.credits.length>=c.target;
  if(done){c.complete=true;c.celebrated=false;}
  chSave(c);
  return {added:true,completed:done};
}
function chUncredit(id,wasComplete){
  var c=chGet();if(!c)return;

function ocrScript(){

  return new Promise(function(res,rej){var sc=document.createElement('script');sc.src=TESS_SRC;sc.onload=res;sc.onerror=function(){rej(new Error('load'));};document.head.appendChild(sc);});
}
function ocrWorker(){
  if(ocr.worker)return Promise.resolve(ocr.worker);
  if(ocr.making)return ocr.making;
  ocr.making=ocrScript().then(function(){return window.Tesseract.createWorker('eng',1,{logger:function(m){if(ocr.onlog)ocr.onlog(m);}});}).then(function(w){ocr.worker=w;ocr.making=null;lsSet('bm_ocr_ready','1');return w;}).catch(function(e){ocr.making=null;throw e;});
  return ocr.making;
}
function ocrIdle(){clearTimeout(ocr.idle);ocr.idle=setTimeout(function(){if(!ocr.busy&&ocr.worker){try{ocr.worker.terminate();}catch(e){}ocr.worker=null;}},90000);}
function ocrAbort(){
  ocr.token++;ocr.busy=false;ocr.onlog=null;
  if(ocr.worker){try{ocr.worker.terminate();}catch(e){}ocr.worker=null;}
}
function ocrPrep(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2400/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),chh=Math.max(1,Math.round(h*k));
        var c=document.createElement('canvas');c.width=cw;c.height=chh;
        var x=c.getContext('2d');x.drawImage(img,0,0,cw,chh);
        var d=x.getImageData(0,0,cw,chh),p=d.data,hist=new Array(256),i,g;
        for(i=0;i<256;i++)hist[i]=0;
        for(i=0;i<p.length;i+=4){g=Math.round((p[i]*299+p[i+1]*587+p[i+2]*114)/1000);p[i]=p[i+1]=p[i+2]=g;hist[g]++;}
        var total=cw*chh,acc=0,lo=0,hi=255;
        for(i=0;i<256;i++){acc+=hist[i];if(acc>=total*0.01){lo=i;break;}}
        acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>=total*0.01){hi=i;break;}}
        var span=Math.max(90,hi-lo);
        for(i=0;i<p.length;i+=4){g=(p[i]-lo)*255/span;g=g<0?0:(g>255?255:g);p[i]=p[i+1]=p[i+2]=g;}
        x.putImageData(d,0,0);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.92));
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
function ocrTidy(t){
  t=String(t||'').replace(/\r/g,'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'');
  t=t.replace(/([a-z])-\n([a-z])/g,'$1$2');
  t=t.replace(/\n{2,}/g,'\u0001').replace(/\n/g,' ').replace(/\u0001/g,'\n\n');
  return t.replace(/[ \t]+/g,' ').replace(/ ?\n\n ?/g,'\n\n').trim();
}
function scanUI(mode,p,first){
  var box=$('#q-scanbox');if(!box)return;
  var btn=$('#q-scanbtn'),pick=$('#q-pickbtn');
  if(mode==='idle'){box.style.display='none';if(btn)btn.style.display='';if(pick)pick.style.display='';return;}
  box.style.display='block';if(btn)btn.style.display='none';if(pick)pick.style.display='none';
  var t=$('#qs-t'),s=$('#qs-s'),b=$('#qs-b');
  if(mode==='prep'){t.textContent='Getting the reader ready';s.textContent=first?'One time only, about 14 MB. After this it works without waiting.':'Just a moment.';ocr.shown=Math.max(ocr.shown,p||0);b.style.width=ocr.shown+'%';}
  else{t.textContent='Reading the page';s.textContent='This happens on your phone. Nothing is uploaded.';b.style.width=(p||0)+'%';}
}
function scanLabel(){var ta=$('#q-text'),btn=$('#q-scanbtn');if(btn)btn.innerHTML=CAM_ICO+(ta&&ta.value.trim()?'Scan Another Page':'Scan a Page');}
function scanFail(msg){ocr.busy=false;scanUI('idle');var er=$('#q-err');if(er)er.textContent=msg;}
function scanPage(file){
  if(!file||ocr.busy||!$('#q-text'))return;
  var tk=++ocr.token,first=!lsGet('bm_ocr_ready'),dataUrl=null;
  ocr.busy=true;ocr.shown=0;
  var er=$('#q-err'),nt=$('#q-note');if(er)er.textContent='';if(nt)nt.style.display='none';
  scanUI('prep',0,first);
  if(!navigator.onLine&&!ocr.worker&&first){scanFail('The reader needs a connection the first time. You can still type the quote.');return;}
  ocr.onlog=function(m){
    if(tk!==ocr.token)return;
    var st=String(m.status||''),pr=Math.round((m.progress||0)*100);
    if(st==='recognizing text')scanUI('read',pr);else scanUI('prep',pr,first);
  };
  ocrPrep(file).then(function(u){dataUrl=u;if(tk!==ocr.token)throw 'cancel';return ocrWorker();})
  .then(function(w){if(tk!==ocr.token)throw 'cancel';scanUI('read',0);return w.recognize(dataUrl);})
  .then(function(r){
    if(tk!==ocr.token)throw 'cancel';
    var ta=$('#q-text');if(!ta)throw 'cancel';
    var text=ocrTidy(r&&r.data&&r.data.text),conf=(r&&r.data&&r.data.confidence)||0;
    ocr.busy=false;ocr.onlog=null;scanUI('idle');ocrIdle();
    if(text.replace(/\s/g,'').length<3||conf<35){scanFail('I could not find any text in that photo. Try again with the page flat and well lit.');return;}
    var cur=ta.value.trim(),joined=cur?cur+' '+text:text,notes=[];
    if(joined.length>2000){joined=joined.slice(0,2000);notes.push('That was long, so only the first 2,000 characters were kept.');}
    if(conf<80)notes.push('This page was hard to read. Please check the text before you save.');
    ta.value=joined;scanLabel();
    var n=$('#q-note');if(n){n.textContent=notes.join(' ');n.style.display=notes.length?'block':'none';}
  })
  .catch(function(e){
    if(e==='cancel')return;
    var m=String(e&&e.message||e);
    if(m==='load'||/network|fetch|load/i.test(m))scanFail('The reader could not load. Check your connection, or type the quote.');
    else if(m==='img')scanFail('That photo could not be read. Try another one.');
    else scanFail('The page could not be read. You can still type the quote.');
  });
}

var AC_KEY='bm_authors',xbLast=0;
function anorm(s){
  s=String(s==null?'':s).toLowerCase();
  try{s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  return s.replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/^(the|a|an) /,'');
}
function inLib(title){
  var t=anorm(title),t0=anorm(String(title).split(':')[0]);
  for(var i=0;i<state.books.length;i++){
    var b=state.books[i],x=anorm(b.title),x0=anorm(String(b.title).split(':')[0]);
    if(x===t||x0===t||x===t0||(t0&&x0===t0))return b;
  }
  return null;
}
function authorNames(s){
  var parts=String(s||'').split(/\s*,\s*/),out=[];
  parts.forEach(function(p){
    p=p.trim();if(!p)return;
    if(out.length&&(/^(jr|sr|ii|iii|iv|phd|md)\.?$/i.test(p)||p.split(/\s+/).length<2))out[out.length-1]+=', '+p;else out.push(p);
  });

}

function authorLinks(b){

}
function okImg(u){return typeof u==='string'&&u.length<1000&&/^https:\/\/(upload\.wikimedia\.org|thumb\.wikimedia\.org|covers\.openlibrary\.org)\//.test(u);}
function authClean(d){
  if(!d||typeof d!=='object')return null;
  var bk=[];
  (Array.isArray(d.books)?d.books:[]).forEach(function(b){
    if(bk.length<12&&b&&typeof b.t==='string'&&b.t&&typeof b.k==='string'&&/^\/works\/OL\d+W$/.test(b.k))
      bk.push({k:b.k,t:b.t.slice(0,200),c:(Number.isInteger(b.c)&&b.c>0?b.c:0),p:(Number.isInteger(b.p)&&b.p>0&&b.p<20000?b.p:0)});
  });
  return {name:String(d.name||'').slice(0,120),desc:String(d.desc||'').slice(0,160),bio:String(d.bio||'').slice(0,1600),
    photo:okImg(d.photo)?d.photo:'',wiki:!!d.wiki,key:/^OL\d+A$/.test(String(d.key||''))?d.key:'',books:bk};
}
function acAll(){try{var o=JSON.parse(lsGet(AC_KEY)||'{}');return(o&&typeof o==='object')?o:{};}catch(e){return {};}}
function acGet(k){var e=acAll()[k];if(!e||typeof e.t!=='number')return null;var d=authClean(e.d);return d?{t:e.t,d:d}:null;}
function acSet(k,d){
  var o=acAll(),ks=Object.keys(o);
  if(!(k in o)){ks.sort(function(a,b){return ((o[a]&&o[a].t)||0)-((o[b]&&o[b].t)||0);});while(ks.length>=25){delete o[ks.shift()];}}
  o[k]={t:Date.now(),d:d};lsSet(AC_KEY,JSON.stringify(o));

function ajget(u){return withTimeout(fetch(u).then(function(r){if(!r.ok)throw new Error('http');return r.json();}),12000);}
var WROLE=/(writer|author|novelist|poet|playwright|dramatist|essayist|journalist|historian|biographer|memoirist|screenwriter|columnist|illustrator|critic|editor|satirist|scholar|philosopher|physician|scientist|theologian|diarist)/i;
function wikiOK(j,name){
  if(!j||j.type!=='standard')return false;
  var last=anorm(name).split(' ').pop();
  return WROLE.test(String(j.description||'')+' '+String(j.extract||'').slice(0,240))&&anorm(j.title||'').indexOf(last)>=0;

function clip(t,n){
  t=String(t||'').replace(/\s+/g,' ').trim();if(t.length<=n)return t;
  var c=t.slice(0,n),i=Math.max(c.lastIndexOf('. '),c.lastIndexOf('! '),c.lastIndexOf('? '));
  return i>n*0.5?c.slice(0,i+1):c.replace(/\s+\S*$/,'')+'\u2026';

var JUNK=/\b(box(ed)? set|boxset|study guide|summary of|sparknotes|cliffsnotes|workbook|coloring book|complete works|collected works|trivia|analysis of)\b/i;
function authBooks(docs){
  var seen={},out=[];
  (docs||[]).forEach(function(d){
    if(out.length>=12||!d||typeof d.title!=='string'||typeof d.key!=='string'||JUNK.test(d.title))return;
    if(Array.isArray(d.language)&&d.language.length&&d.language.indexOf('eng')<0)return;
    var k=anorm(d.title);if(!k||seen[k])return;seen[k]=1;
    out.push({k:d.key,t:d.title,c:d.cover_i||0,p:d.number_of_pages_median||0});
  });
  return out;
}
function authKey(name,title){
  var n=anorm(name),enc=encodeURIComponent;
  function pick(docs){
    for(var i=0;i<docs.length;i++){var names=docs[i].author_name||[],keys=docs[i].author_key||[];
      for(var j=0;j<names.length;j++)if(anorm(names[j])===n&&/^OL\d+A$/.test(keys[j]||''))return keys[j];}
    return null;
  }
  var p=title?ajget('https://openlibrary.org/search.json?title='+enc(title)+'&author='+enc(name)+'&limit=5&fields=title,author_name,author_key').then(function(j){return pick(j.docs||[]);}).catch(function(){return null;}):Promise.resolve(null);

    if(k)return k;
    return ajget('https://openlibrary.org/search/authors.json?q='+enc(name)+'&limit=10').then(function(j){
      var best=null;
      (j.docs||[]).forEach(function(d){var key=String(d&&d.key||'').replace('/authors/','');if(d&&anorm(d.name)===n&&/^OL\d+A$/.test(key)&&(!best||(d.work_count||0)>(best.work_count||0)))best={key:key,work_count:d.work_count||0};});
      if(!best)throw new Error('nf');

function authBuild(name,key,works,det,wiki){
  var wok=wikiOK(wiki,name),photo='',desc='',bio='';
  if(wok){desc=String(wiki.description||'');bio=clip(wiki.extract,1200);if(wiki.thumbnail&&okImg(wiki.thumbnail.source))photo=wiki.thumbnail.source;}
  if(!photo&&det&&Array.isArray(det.photos)&&det.photos.some(function(x){return x>0;}))photo='https://covers.openlibrary.org/a/olid/'+key+'-M.jpg';
  if(!bio&&det)bio=cleanSynopsis(det.bio);

}
function authFetch(name,title){
  return authKey(name,title).then(function(key){
    var enc=encodeURIComponent;
    var pW=ajget('https://openlibrary.org/search.json?author_key='+key+'&sort=editions&limit=40&fields=key,title,first_publish_year,cover_i,edition_count,language,number_of_pages_median');
    var pD=ajget('https://openlibrary.org/authors/'+key+'.json').catch(function(){return null;});
    var pK=ajget('https://en.wikipedia.org/api/rest_v1/page/summary/'+enc(name.replace(/ /g,'_'))).catch(function(){return null;});
    return Promise.all([pW,pD,pK]).then(function(r){return authBuild(name,key,r[0],r[1],r[2]);});

function authOpen(name){return state.card==='author'&&state.author&&state.author.name===name;}
function authLoad(name,title,force){
  var ck=anorm(name)+'|'+anorm(title||'').slice(0,40),hit=force?null:acGet(ck);
  state.author={name:name,title:title||'',st:'load',d:null,more:false};

    acSet(ck,d);

    state.author.st='ok';state.author.d=d;renderCard();

/* ----- the rules ----- */
function fts(b){return b.finishedAt||b.updatedAt||b.addedAt||0;}

  var E={},bs=state.books,ch=chGet();
  var fin=bs.filter(function(b){return b.status==='finished';}).sort(function(a,b){return fts(a)-fts(b);});
  function at(v){return v||now;}
  if(fin.length>=1)E.spine=at(fts(fin[0]));
  if(fin.length>=10)E.worm=at(fts(fin[9]));
  if(fin.length>=25)E.bib=at(fts(fin[24]));
  if(fin.length>=50)E.legend=at(fts(fin[49]));
  var pg=0;bs.forEach(function(b){pg+=Math.max(0,b.currentPage||0);});
  if(pg>=5000)E.pages=now;
  var big=fin.filter(function(b){return b.pages>600;});
  if(big.length)E.door=at(fts(big[0]));
  var qk=fin.filter(function(b){var d=(b.finishedAt||0)-(b.startedAt||0);return b.startedAt&&b.finishedAt&&d>=600000&&d<=3*864e5;});
  if(qk.length)E.quick=qk[0].finishedAt;
