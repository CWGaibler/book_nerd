.mdk{transform:rotateY(180deg) translateZ(calc(var(--s)*.046))}

.bgb .bgin b{display:none}

.bgdot[hidden]{display:none}

/* ---------- When Did You Finish It? ---------- */
function finWhen(when,date){
  if(when==='today')return {at:Date.now()};
  if(when==='past')return {at:null};
  if(when==='date'){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date||''));if(!m)return null;
    if(+m[1]<1900||String(date)>dstr(Date.now()))return null;
    var t=new Date(+m[1],+m[2]-1,+m[3],12,0,0).getTime();if(!isFinite(t))return null;
    return {at:Math.min(t,Date.now())};
  }
  return null;
}

/* ---------- Change Finish Date ---------- */
function cfTracked(b){return !!(b.startedAt&&b.finishedAt&&b.startedAt!==b.finishedAt);}
function cfResolve(b,when,date){
  if(when==='past')return {at:null};
  var f=finWhen(when,date);
  if(!f)return {err:(/^\d{4}-\d{2}-\d{2}$/.test(String(date||'')))?'The finish date cannot be in the future.':'Pick a finish date.'};
  var at=f.at;
  if(cfTracked(b)){
    if(when==='date'&&String(date)<dstr(b.startedAt))return {err:'The finish date cannot be before the day you started ('+fmtDate(b.startedAt)+').'};
    at=Math.min(Math.max(at,b.startedAt),Date.now());

function cfHelp(b,when,date){

  if(when==='past')return 'In the Past keeps it out of your challenge and year totals.'+(has?' It will be taken out of your challenge.':'');

function toIsbn13(raw){
  raw=String(raw).toUpperCase();
  var i,sum;
  if(/^\d{13}$/.test(raw)){
    if(!/^97[89]/.test(raw))return '';
    sum=0;for(i=0;i<13;i++)sum+=(i%2?3:1)*parseInt(raw.charAt(i),10);
    return sum%10===0?raw:'';
  }
  if(/^\d{9}[\dX]$/.test(raw)){
    sum=0;for(i=0;i<9;i++)sum+=(10-i)*parseInt(raw.charAt(i),10);
    sum+=(raw.charAt(9)==='X'?10:parseInt(raw.charAt(9),10));
    if(sum%11!==0)return '';
    var core='978'+raw.slice(0,9),t=0;for(i=0;i<12;i++)t+=(i%2?3:1)*parseInt(core.charAt(i),10);
    return core+String((10-t%10)%10);
  }
  return '';
}

function cleanSynopsis(raw){
  if(raw&&typeof raw==='object')raw=raw.value;
  if(typeof raw!=='string')return '';
  var s=raw;
  if(/<[a-z][\s\S]*>/i.test(s)){
    try{s=new DOMParser().parseFromString(s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n'),'text/html').body.textContent||'';}
    catch(e){s=s.replace(/<[^>]+>/g,' ');}
  }
  s=s.split(/\r?\n\s*(?:-{4,}|_{4,}|={4,})/)[0];
  s=s.split(/\r?\n\s*(?:Contains:|Also contained in|See also|Source:|\[\d+\]:|Previously published as)/i)[0];
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\[\d+\]/g,'$1').replace(/\(\[source\]\[\d+\]\)/gi,'');
  s=s.replace(/^#+\s*/gm,'').replace(/\*+/g,'').replace(/(^|\s)_+(?=\S)|(\S)_+(?=\s|[.,;:!?]|$)/g,'$1$2');
  s=s.replace(/\s+/g,' ').trim();
  if(s.length>1200){
    var cut=s.slice(0,1200),i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('! '),cut.lastIndexOf('? '));
    s=(i>500)?cut.slice(0,i+1):cut.replace(/\s+\S*$/,'')+'\u2026';
  }
  return s.length>=40?s:'';
}
function jget(u){

function fetchSynopsis(b){

  function viaWork(key){return safe(jget('https://openlibrary.org'+key+'.json')).then(function(w){return w?cleanSynopsis(w.description):'';});}
  var chain=Promise.resolve('');
  if(b.olKey){chain=viaWork(b.olKey);}
  else if(b.isbn){
    chain=safe(jget('https://openlibrary.org/isbn/'+b.isbn+'.json')).then(function(ed){
      if(!ed)return '';

}

function impParseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  var rows=[],row=[],f='',q=false,i=0,n=text.length,c;
  while(i<n){
    c=text.charAt(i);
    if(q){
      if(c==='"'){if(text.charAt(i+1)==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}
      f+=c;i++;continue;
    }
    if(c==='"'&&f===''){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){if(text.charAt(i+1)==='\n')i++;row.push(f);rows.push(row);row=[];f='';i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}

function impDate(v){

  var m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{
    m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(!m)return 0;
    var a=+m[1],b=+m[2];y=+m[3];if(a>12){d=a;mo=b;}else{mo=a;d=b;}

function cleanBook(x){
  if(!x||typeof x!=='object')return null;
  var title=typeof x.title==='string'?x.title.trim():'';
  if(!title||typeof x.id!=='string'||!x.id)return null;
  var num=function(v){v=Number(v);return isFinite(v)&&v>0?Math.floor(v):0;};
  var now=Date.now();
  var b={id:x.id.slice(0,64),title:title.slice(0,300),author:typeof x.author==='string'?x.author.slice(0,300):'',
    pages:num(x.pages),status:STAT[x.status]?x.status:'toread',currentPage:num(x.currentPage),
    rating:(function(v){v=Number(v);return isFinite(v)&&v>0?Math.min(5,Math.round(v*2)/2):0;})(x.rating),notes:typeof x.notes==='string'?x.notes.slice(0,20000):'',
    addedAt:num(x.addedAt)||now,updatedAt:num(x.updatedAt)||now};
  if(x.owned===false)b.owned=false;
  if(typeof x.synopsis==='string'&&x.synopsis.trim())b.synopsis=x.synopsis.slice(0,2000);
  if(typeof x.olKey==='string'&&/^\/works\/OL\d+W$/.test(x.olKey))b.olKey=x.olKey;
  if(typeof x.review==='string'&&x.review.trim())b.review=x.review.slice(0,20000);
  if(num(x.startedAt))b.startedAt=num(x.startedAt);
  if(num(x.finishedAt))b.finishedAt=num(x.finishedAt);
  if(typeof x.isbn==='string'&&/^[0-9Xx]{10,13}$/.test(x.isbn))b.isbn=x.isbn;
  if(typeof x.coverUrl==='string'&&/^https?:\/\//i.test(x.coverUrl))b.coverUrl=x.coverUrl.slice(0,500);
  if(typeof x.year==='string'&&/^\d{4}$/.test(x.year))b.year=x.year;
  if(num(x.imp))b.imp=num(x.imp);
  if(Array.isArray(x.quotes)){
    var qs=[];
    x.quotes.forEach(function(q){
      if(qs.length>=100||!q||typeof q!=='object')return;
      var t=typeof q.text==='string'?q.text.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'').trim().slice(0,2000):'';
      if(!t)return;
      var at=Number(q.at),pn=Math.floor(Number(q.page));
      qs.push({id:(typeof q.id==='string'&&q.id?q.id.slice(0,64):uid()),text:t,page:(isFinite(pn)&&pn>0?Math.min(pn,99999):0),at:(isFinite(at)&&at>0?Math.floor(at):now)});
    });
    if(qs.length)b.quotes=qs;
  }
  return b;
}
function handleRestoreFile(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var data;
    try{data=JSON.parse(String(r.result));}catch(e){toast('That file is not a Book Nerd backup');return;}
    var list=data&&data.app==='bookmark'&&Array.isArray(data.books)?data.books:null;
    if(!list){toast('That file is not a Book Nerd backup');return;}
    var books=[];list.forEach(function(x){var c=cleanBook(x);if(c)books.push(c);});
    if(!books.length){toast('That backup has no books in it');return;}
    var fresh=0,newer=0;
    books.forEach(function(b){var e=byId(b.id);if(!e)fresh++;else if(b.updatedAt>e.updatedAt)newer++;});
    pendingRestore=books;pendingName=cleanName(data.name);pendingChallenge=chClean(data.challenge);pendingBadges=BGX.clean(data.badges);pendingPhoto=photoClean(data.photo);
    openSheet('<h2>Restore Books?</h2><p class="sm" style="margin:0 0 6px">The backup has '+books.length+' book'+(books.length===1?'':'s')+'.</p>'+
      '<p class="sm" style="margin:0 0 16px">'+fresh+' new to this phone'+(newer?', '+newer+' updated':'')+'. Books already on this phone are kept, unless the backup has a newer copy.</p>'+
      '<div class="row"><button class="ob cn" data-act="closesheet2">Cancel</button><button class="pb" data-act="restoreyes">Restore</button></div>');
  };
  r.onerror=function(){toast('Could not read that file');};
  r.readAsText(file);
}

function afterReview(){
  var rv=state.rev;state.rev=null;
  if(!rv)return;
  var fb=byId(rv.id);if(!fb)return;
  refresh();
  var bgNew=[];
  toast('Marked as Finished',{label:'Undo',fn:function(){
    var p=rv.prev;
    fb.status=p.status;fb.currentPage=p.currentPage;
    ['startedAt','finishedAt','review'].forEach(function(k){if(p[k]===undefined)delete fb[k];else fb[k]=p[k];});

    if(rv.cr&&rv.cr.added)chUncredit(fb.id,rv.cr.completed);

/* ---------- finishing a book ---------- */
function finishBook(fb){
  if((celeb.on&&Date.now()-celeb.t0<3500)||!fb||fb.status==='finished')return;
  var prev={status:fb.status,currentPage:fb.currentPage,startedAt:fb.startedAt,finishedAt:fb.finishedAt,rating:fb.rating,review:fb.review};
  chLast=null;setStatus(fb,'finished');refresh();
  state.rev={id:fb.id,rating:fb.rating||0,prev:prev,cr:chLast};
  celebrate(function(){
    if(!state.rev||state.rev.id!==fb.id)return;
    openSheet(reviewSheet(fb),afterReview);
  });
}
function restoreBook(fb,p){
  fb.status=p.status;if(p.currentPage!==undefined)fb.currentPage=p.currentPage;
  ['startedAt','finishedAt'].forEach(function(k){if(p[k]===undefined)delete fb[k];else fb[k]=p[k];});
  fb.updatedAt=Date.now();dbPut(fb);refresh();
}
function startBook(fb){
  if(!fb||fb.status!=='toread')return;
  var p={status:fb.status,startedAt:fb.startedAt,finishedAt:fb.finishedAt};
  state.editProg=false;setStatus(fb,'reading');
  if(!((fb.currentPage||0)>0)){fb.startedAt=Date.now();dbPut(fb);}
  refresh();
  toast('Started Reading',{label:'Undo',fn:function(){restoreBook(fb,p);}});
  BGX.check();
}
function dnfBook(fb){
  if(!fb||fb.status!=='reading')return;
  var p={status:fb.status,startedAt:fb.startedAt,finishedAt:fb.finishedAt};
  state.editProg=false;setStatus(fb,'dnf');refresh();
  toast('Marked as Did Not Finish',{label:'Undo',fn:function(){restoreBook(fb,p);}});
  BGX.check();
}
function resumeBook(fb){
  if(!fb||fb.status!=='dnf')return;
  var p={status:fb.status,startedAt:fb.startedAt,finishedAt:fb.finishedAt};
  setStatus(fb,'reading');refresh();
  toast('Back to Currently Reading',{label:'Undo',fn:function(){restoreBook(fb,p);}});
  BGX.check();
}
function alreadyRead(fb,fin){
  if(!fb||fb.status==='finished')return;
  if(!fin&&fb.status==='toread'){state.fw={id:fb.id,when:'past',date:dstr(Date.now())};openSheet(finSheet(fb));return;}
  var prev={status:fb.status,currentPage:fb.currentPage,startedAt:fb.startedAt,finishedAt:fb.finishedAt,rating:fb.rating,review:fb.review};
  chLast=null;setStatus(fb,'finished',fin);refresh();
  state.rev={id:fb.id,rating:fb.rating||0,prev:prev,cr:chLast};
  openSheet(reviewSheet(fb),afterReview);
}

}

function celebBurst(host,x0,y0,o,m){
  var cols=['#FFB500','#42BB37','#00BDF6','#009CC6'],g=800*m.sy;
  for(var i=0;i<44;i++){
    var a=(o.a0+Math.random()*(o.a1-o.a0))*Math.PI/180,v=o.v0+Math.random()*(o.v1-o.v0);
    var vx=Math.cos(a)*v*m.sx,vy=Math.sin(a)*v*m.sy,T=1.7+Math.random()*.7,rot=(Math.random()-.5)*1440,circ=Math.random()<.3;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;left:0;top:0;background:'+cols[i%4]+';width:'+(circ?9:12)+'px;height:'+(circ?9:7)+'px;border-radius:'+(circ?'50%':'1px');
    host.appendChild(e);
    var kf=[];
    for(var j=0;j<=18;j++){
      var t=T*j/18,x=x0+vx*(1-Math.exp(-o.k*t))/o.k,y=y0+vy*t+.5*g*t*t;

  if(reduced()||!document.documentElement.animate){done();return;}

  var shield=document.createElement('div');shield.id='celx';

    host.appendChild(rg);
    rg.querySelector('.rg').animate([{strokeDashoffset:276.5},{strokeDashoffset:0}],{duration:450*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.ck').animate([{strokeDashoffset:70},{strokeDashoffset:0}],{duration:300*S,delay:380*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.pu').animate([{transform:'scale(1)',opacity:0},{transform:'scale(1)',opacity:.7,offset:.01},{transform:'scale(1.5)',opacity:0}],{duration:500*S,delay:620*S,easing:'ease-out',fill:'both'});

    rg.animate([{opacity:1},{opacity:0}],{duration:250*S,delay:1000*S,fill:'both'});

    var x=$('#celx');if(x&&x.parentNode)x.parentNode.removeChild(x);

    done();
  },at);

/* ---------- reading challenge ---------- */
var CH_KEY='bm_challenge',chLast=null;
function dstr(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(Date.now());}
function okDate(v){
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;
  var p=v.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.getFullYear()===+p[0]&&d.getMonth()===+p[1]-1&&d.getDate()===+p[2];
}
function dlabel(v){var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function chClean(x){
  if(!x||typeof x!=='object')return null;
  var t=Math.floor(Number(x.target));
  if(!isFinite(t)||t<1||t>999)return null;
  if(!okDate(x.start)||!okDate(x.end)||x.end<x.start)return null;
  var cr=[];
  if(Array.isArray(x.credits))x.credits.forEach(function(c){
    var b=cleanBook({id:c&&c.id,title:c&&c.title,author:c&&c.author,coverUrl:c&&c.coverUrl,isbn:c&&c.isbn});
    var f=Number(c&&c.finishedAt);
    if(b&&isFinite(f)&&f>0&&!cr.some(function(q){return q.id===b.id;}))cr.push({id:b.id,title:b.title,author:b.author,coverUrl:b.coverUrl||'',isbn:b.isbn||'',finishedAt:Math.floor(f)});
  });
  return {target:t,start:x.start,end:x.end,credits:cr.slice(0,999),complete:!!x.complete,celebrated:!!x.celebrated,ended:!!x.ended,created:Number(x.created)||Date.now()};
}
function chGet(){var raw=lsGet(CH_KEY);if(!raw)return null;try{return chClean(JSON.parse(raw));}catch(e){return null;}}
function chSave(c){lsSet(CH_KEY,c?JSON.stringify(c):'');}
function chExpire(){var c=chGet();if(!c||c.complete||todayStr()<=c.end)return;if(c.ended||!c.credits.length){chSave(null);return;}chEndReq('time');}
function chTitle(c){
  var n=c.target,w=n===1?'Book':'Books';
  if(c.start.slice(5)==='01-01'&&c.end.slice(5)==='12-31'&&c.start.slice(0,4)===c.end.slice(0,4))return n+' '+w+' in '+c.end.slice(0,4);
  var d=dlabel(c.end);
  if(c.end.slice(0,4)===String(new Date().getFullYear()))d=d.replace(/,\s*\d{4}$/,'');
  return n+' '+w+' by '+d;
}
function chSnap(b){return {id:b.id,title:b.title,author:b.author||'',coverUrl:b.coverUrl||'',isbn:b.isbn||'',finishedAt:b.finishedAt};}
function chCredit(b){
  var c=chGet();if(!c||c.complete||!b||!b.finishedAt)return null;
  var d=dstr(b.finishedAt);if(d<c.start||d>c.end)return null;
  for(var i=0;i<c.credits.length;i++)if(c.credits[i].id===b.id)return {added:false,completed:false};
  c.credits.push(chSnap(b));
  var done=c.credits.length>=c.target;
  if(done){c.complete=true;c.celebrated=false;}
  chSave(c);
  return {added:true,completed:done};
}
function chUncredit(id,wasComplete){
  var c=chGet();if(!c)return;
  c.credits=c.credits.filter(function(q){return q.id!==id;});
  if(wasComplete){c.complete=false;c.celebrated=false;c.ended=false;chEndClose();}
  chSave(c);
}

var SKC={navy:[0,31,95],deep:[0,3,60],cb:[0,41,107],fuch:[209,0,111],gold:[255,181,0],white:[255,255,255]};

  [0,SKC.deep,SKC.navy],

  try{s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}
  return s.replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/^(the|a|an) /,'');
}
function inLib(title){
  var t=anorm(title),t0=anorm(String(title).split(':')[0]);
  for(var i=0;i<state.books.length;i++){
    var b=state.books[i],x=anorm(b.title),x0=anorm(String(b.title).split(':')[0]);
    if(x===t||x0===t||x===t0||(t0&&x0===t0))return b;
  }
  return null;
}
function authorNames(s){

  parts.forEach(function(p){
    p=p.trim();if(!p)return;
    if(out.length&&(/^(jr|sr|ii|iii|iv|phd|md)\.?$/i.test(p)||p.split(/\s+/).length<2))out[out.length-1]+=', '+p;else out.push(p);
  });

}

function okImg(u){return typeof u==='string'&&u.length<1000&&/^https:\/\/(upload\.wikimedia\.org|thumb\.wikimedia\.org|covers\.openlibrary\.org)\//.test(u);}
function authClean(d){

    if(bk.length<12&&b&&typeof b.t==='string'&&b.t&&typeof b.k==='string'&&/^\/works\/OL\d+W$/.test(b.k))
      bk.push({k:b.k,t:b.t.slice(0,200),c:(Number.isInteger(b.c)&&b.c>0?b.c:0),p:(Number.isInteger(b.p)&&b.p>0&&b.p<20000?b.p:0)});
  });

    photo:okImg(d.photo)?d.photo:'',wiki:!!d.wiki,key:/^OL\d+A$/.test(String(d.key||''))?d.key:'',books:bk};
}
function acAll(){try{var o=JSON.parse(lsGet(AC_KEY)||'{}');return(o&&typeof o==='object')?o:{};}catch(e){return {};}}

function ajget(u){return withTimeout(fetch(u).then(function(r){if(!r.ok)throw new Error('http');return r.json();}),12000);}
var WROLE=/(writer|author|novelist|poet|playwright|dramatist|essayist|journalist|historian|biographer|memoirist|screenwriter|columnist|illustrator|critic|editor|satirist|scholar|philosopher|physician|scientist|theologian|diarist)/i;
function wikiOK(j,name){
  if(!j||j.type!=='standard')return false;
  var last=anorm(name).split(' ').pop();
  return WROLE.test(String(j.description||'')+' '+String(j.extract||'').slice(0,240))&&anorm(j.title||'').indexOf(last)>=0;

function clip(t,n){
  t=String(t||'').replace(/\s+/g,' ').trim();if(t.length<=n)return t;
  var c=t.slice(0,n),i=Math.max(c.lastIndexOf('. '),c.lastIndexOf('! '),c.lastIndexOf('? '));
  return i>n*0.5?c.slice(0,i+1):c.replace(/\s+\S*$/,'')+'\u2026';
}
var JUNK=/\b(box(ed)? set|boxset|study guide|summary of|sparknotes|cliffsnotes|workbook|coloring book|complete works|collected works|trivia|analysis of)\b/i;
function authBooks(docs){
  var seen={},out=[];
  (docs||[]).forEach(function(d){
    if(out.length>=12||!d||typeof d.title!=='string'||typeof d.key!=='string'||JUNK.test(d.title))return;
    if(Array.isArray(d.language)&&d.language.length&&d.language.indexOf('eng')<0)return;
    var k=anorm(d.title);if(!k||seen[k])return;seen[k]=1;
    out.push({k:d.key,t:d.title,c:d.cover_i||0,p:d.number_of_pages_median||0});
  });
  return out;
}
function authKey(name,title){
  var n=anorm(name),enc=encodeURIComponent;
  function pick(docs){
    for(var i=0;i<docs.length;i++){var names=docs[i].author_name||[],keys=docs[i].author_key||[];
      for(var j=0;j<names.length;j++)if(anorm(names[j])===n&&/^OL\d+A$/.test(keys[j]||''))return keys[j];}
    return null;
  }
  var p=title?ajget('https://openlibrary.org/search.json?title='+enc(title)+'&author='+enc(name)+'&limit=5&fields=title,author_name,author_key').then(function(j){return pick(j.docs||[]);}).catch(function(){return null;}):Promise.resolve(null);
  return p.then(function(k){
    if(k)return k;
    return ajget('https://openlibrary.org/search/authors.json?q='+enc(name)+'&limit=10').then(function(j){
      var best=null;
      (j.docs||[]).forEach(function(d){var key=String(d&&d.key||'').replace('/authors/','');if(d&&anorm(d.name)===n&&/^OL\d+A$/.test(key)&&(!best||(d.work_count||0)>(best.work_count||0)))best={key:key,work_count:d.work_count||0};});
      if(!best)throw new Error('nf');
      return best.key;
    });
  });
}
function authBuild(name,key,works,det,wiki){
  var wok=wikiOK(wiki,name),photo='',desc='',bio='';
  if(wok){desc=String(wiki.description||'');bio=clip(wiki.extract,1200);if(wiki.thumbnail&&okImg(wiki.thumbnail.source))photo=wiki.thumbnail.source;}
  if(!photo&&det&&Array.isArray(det.photos)&&det.photos.some(function(x){return x>0;}))photo='https://covers.openlibrary.org/a/olid/'+key+'-M.jpg';
  if(!bio&&det)bio=cleanSynopsis(det.bio);
  return authClean({name:name,desc:desc,bio:bio,photo:photo,wiki:wok,key:key,books:authBooks(works&&works.docs)});
}
function authFetch(name,title){
  return authKey(name,title).then(function(key){
    var enc=encodeURIComponent;
    var pW=ajget('https://openlibrary.org/search.json?author_key='+key+'&sort=editions&limit=40&fields=key,title,first_publish_year,cover_i,edition_count,language,number_of_pages_median');
    var pD=ajget('https://openlibrary.org/authors/'+key+'.json').catch(function(){return null;});
    var pK=ajget('https://en.wikipedia.org/api/rest_v1/page/summary/'+enc(name.replace(/ /g,'_'))).catch(function(){return null;});
    return Promise.all([pW,pD,pK]).then(function(r){return authBuild(name,key,r[0],r[1],r[2]);});
  });
}
function authOpen(name){return state.card==='author'&&state.author&&state.author.name===name;}
function authLoad(name,title,force){
  var ck=anorm(name)+'|'+anorm(title||'').slice(0,40),hit=force?null:acGet(ck);
  state.author={name:name,title:title||'',st:'load',d:null,more:false};
  if(hit){state.author.st='ok';state.author.d=hit.d;renderCard();if(Date.now()-hit.t<14*864e5)return;}

    acSet(ck,d);
    if(!authOpen(name)||!state.author)return;
    state.author.st='ok';state.author.d=d;renderCard();
