<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001F5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookmark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Bookmark</title>
<style>
:root{--navy:#001F5F;--card:#00296B;--line:#00478E;--deep:#00033C;--blue:#00BDF6;--gold:#FFB500;--green:#42BB37;--dblue:#009CC6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--navy);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:#fff}
.tb{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100vh}
#view{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 110px}
.hr{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.hd{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;min-height:36px}
.ic{color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin:-7px}
.ic.hit,.ic.on{color:var(--blue)}
.cd{background:var(--card);border-radius:14px;padding:12px}
.lb{font-size:12px;color:#fff;margin:0 0 6px}
.sm{font-size:13px;color:#fff}
.chips{display:flex;gap:6px;margin:14px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--card);color:#fff;flex:none}
.ch.sel{background:var(--blue);color:var(--deep)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.cv{aspect-ratio:2/3;padding:8px;display:flex;align-items:flex-end;font-size:12px;line-height:1.25;font-weight:500;border-radius:4px;background:var(--c);color:var(--t,#fff);border-bottom:4px solid var(--st,transparent);overflow:hidden;word-break:break-word;width:100%}
.cv span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px}
.bar b{display:block;height:100%;border-radius:3px;background:var(--green)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);border-top:0.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 0 10px}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#fff;min-width:72px}
.ni svg{color:#fff}
.ni.on svg,.ni.hit svg{color:var(--blue)}
.ni.on{font-weight:500}
.bt{background:var(--card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;font-size:16px;color:#fff;width:100%;text-align:left}
.bt svg{color:#fff}
.bt.hit svg{color:var(--blue)}
.bt small{margin-left:auto;font-size:12px}
.bt[disabled]{opacity:.6;cursor:default}
.pb{display:block;width:100%;background:var(--blue);color:var(--deep);border-radius:12px;padding:14px;text-align:center;font-size:16px;font-weight:500}
.ob{display:block;width:100%;border:0.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:15px;color:#fff}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;color:var(--deep)}
.fld{display:block;margin-top:16px}
.fld input,.fld textarea{width:100%;background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px;outline:0}
.fld input:focus,.fld textarea:focus{border-color:var(--blue)}
.fld textarea{resize:none;min-height:96px;line-height:1.4}
.err{color:var(--gold);font-size:14px;margin:8px 0 0;min-height:20px}
.row{display:flex;gap:8px}
.row>*{flex:1}
h2{font-size:18px;font-weight:500;margin:0 0 6px}
.center{text-align:center}
.stars{display:flex;align-items:center;gap:2px;margin-left:-4px}
.star{padding:4px;color:var(--line)}
.star.f{color:var(--gold)}
.star.f svg{fill:var(--gold)}
.tr{display:inline-flex;align-items:center;gap:6px;padding:10px;font-size:14px;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--card);border:0.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;z-index:20;max-width:90%}
.ov{position:fixed;inset:0;background:rgba(0,3,60,.7);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:0.5px solid var(--line)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-top:0.5px solid var(--line);font-size:16px;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.opt small{margin-left:auto;font-size:12px}
.logo{display:block;height:28px;width:auto}
.empty{text-align:center;padding:48px 8px}
.empty p{margin:0 0 20px}
.hidden{display:none!important}
</style>
</head>
<body>

</svg>
<div id="app"><main id="view"></main></div>
<nav id="nav"><div>
<button class="ni" data-go="library" aria-label="Library"><svg class="tb" width="24" height="24" aria-hidden="true"><use href="#i-logo"/></svg>Library</button>
<button class="ni" data-go="add" aria-label="Scan"><svg class="tb" width="24" height="24" aria-hidden="true"><use href="#i-barcode"/></svg>Scan</button>
<button class="ni" data-go="backup" aria-label="Backup"><svg class="tb" width="24" height="24" aria-hidden="true"><use href="#i-settings"/></svg>Backup</button>
</div></nav>
<div id="layer"></div>
<script>
(function(){
'use strict';
var STAT={
  toread:{label:'To Read',color:'#FFB500'},
  reading:{label:'Reading',color:'#42BB37'},
  finished:{label:'Finished',color:'#00BDF6'},
  dnf:{label:'Did Not Finish',color:'#009CC6'}
};
var ORDER=['toread','reading','finished','dnf'];
var COVERS=['#3D5A80','#4E5859','#6B8E6B','#7A5C99','#6F6A5E','#2F6F73'];
var LOCKUP='<svg class="logo" viewBox="0 0 140 28" aria-hidden="true"><svg x="0" y="1" width="28" height="26" viewBox="22 24 56 52"><rect x="26" y="33.5" width="9" height="36" rx="1.5" fill="#FFB500"/><rect x="39" y="25.5" width="9" height="44" rx="1.5" fill="#42BB37"/><rect x="52" y="37.5" width="9" height="32" rx="1.5" fill="#00BDF6"/><rect x="65" y="29.5" width="9" height="40" rx="1.5" fill="#009CC6"/><rect x="23" y="71.5" width="54" height="3" rx="1.5" fill="#F0D9B2"/></svg><path transform="translate(38 21.9) scale(0.022)" d="M155 0V-100H356Q409 -100 438.0 -133.0Q467 -166 467 -209Q467 -238 454.0 -263.0Q441 -288 416.0 -303.0Q391 -318 356 -318H155V-418H339Q384 -418 411.0 -441.0Q438 -464 438 -509Q438 -554 411.0 -577.0Q384 -600 339 -600H155V-700H342Q413 -700 460.0 -674.0Q507 -648 530.0 -607.0Q553 -566 553 -519Q553 -464 522.5 -422.0Q492 -380 433 -354L442 -390Q508 -363 545.0 -314.0Q582 -265 582 -199Q582 -145 555.5 -100.0Q529 -55 477.5 -27.5Q426 0 351 0ZM76 0V-700H191V0Z M903 10Q833 10 776.0 -23.5Q719 -57 685.5 -114.0Q652 -171 652 -241Q652 -311 685.5 -367.0Q719 -423 776.0 -456.5Q833 -490 903 -490Q974 -490 1031.0 -457.0Q1088 -424 1121.5 -367.5Q1155 -311 1155 -241Q1155 -171 1121.5 -114.0Q1088 -57 1031.0 -23.5Q974 10 903 10ZM903 -96Q944 -96 975.5 -114.5Q1007 -133 1024.5 -166.0Q1042 -199 1042 -241Q1042 -283 1024.0 -315.0Q1006 -347 975.0 -365.5Q944 -384 903 -384Q863 -384 831.5 -365.5Q800 -347 782.5 -315.0Q765 -283 765 -241Q765 -199 782.5 -166.0Q800 -133 831.5 -114.5Q863 -96 903 -96Z M1466 10Q1396 10 1339.0 -23.5Q1282 -57 1248.5 -114.0Q1215 -171 1215 -241Q1215 -311 1248.5 -367.0Q1282 -423 1339.0 -456.5Q1396 -490 1466 -490Q1537 -490 1594.0 -457.0Q1651 -424 1684.5 -367.5Q1718 -311 1718 -241Q1718 -171 1684.5 -114.0Q1651 -57 1594.0 -23.5Q1537 10 1466 10ZM1466 -96Q1507 -96 1538.5 -114.5Q1570 -133 1587.5 -166.0Q1605 -199 1605 -241Q1605 -283 1587.0 -315.0Q1569 -347 1538.0 -365.5Q1507 -384 1466 -384Q1426 -384 1394.5 -365.5Q1363 -347 1345.5 -315.0Q1328 -283 1328 -241Q1328 -199 1345.5 -166.0Q1363 -133 1394.5 -114.5Q1426 -96 1466 -96Z M2114 0 1911 -245 2113 -480H2244L2012 -216L2017 -279L2254 0ZM1809 0V-720H1919V0Z M2304 0V-480H2414V0ZM2623 0V-286Q2623 -334 2593.0 -360.5Q2563 -387 2519 -387Q2489 -387 2465.5 -375.0Q2442 -363 2428.0 -340.5Q2414 -318 2414 -286L2371 -310Q2371 -365 2395.0 -405.0Q2419 -445 2460.0 -467.5Q2501 -490 2552 -490Q2603 -490 2644.0 -468.0Q2685 -446 2709.0 -406.0Q2733 -366 2733 -310V0ZM2942 0V-286Q2942 -334 2912.0 -360.5Q2882 -387 2838 -387Q2809 -387 2785.0 -375.0Q2761 -363 2747.0 -340.5Q2733 -318 2733 -286L2671 -310Q2676 -365 2703.0 -405.0Q2730 -445 2772.5 -467.5Q2815 -490 2866 -490Q2918 -490 2960.0 -468.0Q3002 -446 3027.0 -406.0Q3052 -366 3052 -310V0Z M3366 10Q3301 10 3248.5 -23.0Q3196 -56 3165.5 -112.5Q3135 -169 3135 -239Q3135 -310 3165.5 -366.5Q3196 -423 3248.5 -456.5Q3301 -490 3366 -490Q3421 -490 3463.5 -466.5Q3506 -443 3531.0 -402.0Q3556 -361 3556 -309V-171Q3556 -119 3531.5 -78.0Q3507 -37 3464.0 -13.5Q3421 10 3366 10ZM3384 -94Q3445 -94 3482.5 -135.0Q3520 -176 3520 -240Q3520 -283 3503.0 -316.0Q3486 -349 3455.5 -367.5Q3425 -386 3384 -386Q3344 -386 3313.5 -367.5Q3283 -349 3265.5 -316.0Q3248 -283 3248 -240Q3248 -197 3265.5 -164.0Q3283 -131 3313.5 -112.5Q3344 -94 3384 -94ZM3513 0V-129L3532 -246L3513 -362V-480H3623V0Z M3745 0V-480H3855V0ZM3855 -267 3817 -286Q3817 -377 3857.5 -433.5Q3898 -490 3980 -490Q4016 -490 4045.0 -477.0Q4074 -464 4099 -435L4027 -361Q4014 -375 3998.0 -381.0Q3982 -387 3961 -387Q3915 -387 3885.0 -358.0Q3855 -329 3855 -267Z M4457 0 4254 -245 4456 -480H4587L4355 -216L4360 -279L4597 0ZM4152 0V-720H4262V0Z" fill="#F0D9B2"/></svg>';

var state={books:[],view:'library',filter:'all',q:'',search:false,id:null,form:'choose',editProg:false,addAs:'toread',err:''};
var db=null,memoryOnly=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ico(n,s){return '<svg class="tb" width="'+s+'" height="'+s+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function $(s,r){return (r||document).querySelector(s);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- storage ---------- */
function openDB(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej(new Error('no indexedDB'));return;}
  var r=indexedDB.open('bookmark',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('books',{keyPath:'id'});};
  r.onsuccess=function(){res(r.result);};
  r.onerror=function(){rej(r.error);};
});}
function dbAll(){return new Promise(function(res,rej){
  var q=db.transaction('books','readonly').objectStore('books').getAll();
  q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};
});}
function dbPut(b){if(memoryOnly)return;try{var t=db.transaction('books','readwrite');t.objectStore('books').put(b);t.onerror=function(){toast('Could not save that change');};}catch(e){toast('Could not save that change');}}
function dbDel(id){if(memoryOnly)return;try{db.transaction('books','readwrite').objectStore('books').delete(id);}catch(e){}}

/* ---------- helpers ---------- */
function byId(id){for(var i=0;i<state.books.length;i++){if(state.books[i].id===id)return state.books[i];}return null;}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function coverHTML(b,extra){
  var c=COVERS[hash(b.title)%COVERS.length];
  var t=(c==='#6B8E6B')?'#00033C':'#fff';
  return '<div class="cv" style="--c:'+c+';--t:'+t+';--st:'+STAT[b.status].color+';'+(extra||'')+'"><span>'+esc(b.title)+'</span></div>';
}
function fmtDate(ts){
  var d=new Date(ts),n=new Date();
  var o={month:'short',day:'numeric'};
  if(d.getFullYear()!==n.getFullYear())o.year='numeric';
  return d.toLocaleDateString('en-US',o);
}
function pct(b){return b.pages>0?Math.min(100,Math.round((b.currentPage||0)/b.pages*100)):null;}
function pageText(b){return b.pages>0?'Page '+(b.currentPage||0)+' of '+b.pages:'Page '+(b.currentPage||0);}
function toast(msg){
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove();},2200);
}
function setStatus(b,st){
  var now=Date.now();
  b.status=st;
  if(st==='reading'&&!b.startedAt)b.startedAt=now;
  if(st==='finished'){b.finishedAt=now;if(b.pages>0)b.currentPage=b.pages;}
  b.updatedAt=now;dbPut(b);
}

/* ---------- views ---------- */
function viewLibrary(){
  var all=state.books.slice().sort(function(a,b){return b.addedAt-a.addedAt;});
  var q=state.q.trim().toLowerCase();
  var list=all.filter(function(b){
    if(state.filter!=='all'&&b.status!==state.filter)return false;
    if(q&&(b.title+' '+(b.author||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var h='<div class="hr"><div role="img" aria-label="Bookmark">'+LOCKUP+'</div>'+
    '<button class="ic'+(state.search?' on':'')+'" data-act="search" aria-label="Search">'+ico('search',22)+'</button></div>';
  if(state.search){h+='<label class="fld" style="margin-top:12px"><input id="q" type="search" placeholder="Search Your Library" value="'+esc(state.q)+'" autocomplete="off"></label>';}
  if(!all.length){
    h+='<div class="empty"><h2>Start Your Library</h2><p class="sm">Tap Scan, then Type It In to add your first book.</p><button class="pb" style="max-width:240px;margin:0 auto" data-go="add">Add a Book</button></div>';
    return h;
  }
  var cur=null;
  if(!q&&state.filter==='all'){
    var rd=all.filter(function(b){return b.status==='reading';}).sort(function(a,b){return b.updatedAt-a.updatedAt;});
    cur=rd[0]||null;
  }
  if(cur){
    var p=pct(cur);
    h+='<button class="cd" data-open="'+cur.id+'" style="display:flex;gap:12px;align-items:center;width:100%;margin-top:14px;text-align:left"><div style="width:48px;flex:none">'+coverHTML(cur,'padding:4px;font-size:8px')+'</div><div style="flex:1;min-width:0"><div class="lb" style="margin:0">Currently Reading</div><div style="font-size:16px;font-weight:500;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(cur.title)+'</div><div class="sm">'+pageText(cur)+'</div>'+(p!==null?'<div class="bar"><b style="width:'+p+'%"></b></div>':'')+'</div></button>';
  }
  h+='<div class="chips">';
  [['all','All']].concat(['reading','toread','finished','dnf'].map(function(k){return [k,STAT[k].label];})).forEach(function(c){
    h+='<button class="ch'+(state.filter===c[0]?' sel':'')+'" data-filter="'+c[0]+'">'+c[1]+'</button>';
  });
  h+='</div>';
  if(!list.length){h+='<div class="empty"><p class="sm">No books match.</p></div>';return h;}
  h+='<div class="grid">';
  list.forEach(function(b){h+='<button data-open="'+b.id+'" aria-label="'+esc(b.title)+'" style="display:block;text-align:left">'+coverHTML(b)+'</button>';});
  h+='</div>';
  return h;
}
function viewAdd(){
  var h='<div class="hd"><button class="ic" data-act="addback" aria-label="Back">'+ico('arrow-left',22)+'</button>';
  if(state.form==='choose'){
    h+='Add a Book</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">'+
    '<button class="bt" disabled>'+ico('barcode',22)+'Scan a Barcode<small>Next Step</small></button>'+
    '<button class="bt" disabled>'+ico('search',22)+'Search by Title<small>Next Step</small></button>'+
    '<button class="bt" data-act="typeit">'+ico('keyboard',22)+'Type It In</button></div>'+
    '<p class="sm" style="margin-top:20px">Scanning and searching by title are coming in the next steps. For now, type a book in by hand.</p>';
    return h;
  }
  h+='Type It In</div>'+
  '<form id="addform" novalidate>'+
  '<label class="fld"><span class="lb">Title</span><input id="f-title" type="text" autocomplete="off" autocapitalize="words"></label>'+
  '<label class="fld"><span class="lb">Author</span><input id="f-author" type="text" autocomplete="off" autocapitalize="words"></label>'+
  '<label class="fld"><span class="lb">Pages</span><input id="f-pages" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label>'+
  '<div class="fld"><div class="lb">Add As</div><div class="row" style="gap:6px;flex-wrap:wrap">';
  ['toread','reading','finished'].forEach(function(k){
    h+='<button type="button" class="ch" data-as="'+k+'" style="flex:none;'+(state.addAs===k?'background:'+STAT[k].color+';color:#00033C':'')+'">'+STAT[k].label+'</button>';
  });
  h+='</div></div><p class="err" id="err">'+esc(state.err)+'</p><button type="submit" class="pb">Add to Library</button></form>';
  return h;
}
function viewDetail(){
  var b=byId(state.id);
  if(!b){state.view='library';return viewLibrary();}
  var st=STAT[b.status];
  var p=pct(b);
  var meta=(b.status==='finished'&&b.finishedAt)?'Finished '+fmtDate(b.finishedAt):(b.startedAt?'Started '+fmtDate(b.startedAt):'Added '+fmtDate(b.addedAt));
  var h='<div class="hr"><button class="ic" data-go="library" aria-label="Back">'+ico('arrow-left',22)+'</button><button class="ic" data-act="status" aria-label="Change status">'+ico('dots',22)+'</button></div>'+
  '<div style="display:flex;gap:14px;margin-top:16px;align-items:center"><div style="width:76px;flex:none">'+coverHTML(b)+'</div><div style="min-width:0"><div style="font-size:18px;font-weight:500;word-break:break-word">'+esc(b.title)+'</div>'+
  (b.author?'<div class="sm" style="font-size:14px;margin:2px 0 10px">'+esc(b.author)+'</div>':'<div style="height:10px"></div>')+
  '<button class="pill" data-act="status" style="background:'+st.color+'">'+st.label+'</button><div class="sm" style="margin-top:8px">'+meta+'</div></div></div>';
  h+='<div class="cd" style="margin-top:18px"><div class="lb">Progress</div>';
  if(state.editProg){
    h+='<div class="row" style="gap:10px"><label><span class="lb">Current Page</span><input id="p-cur" type="text" inputmode="numeric" pattern="[0-9]*" value="'+(b.currentPage||0)+'" style="width:100%;background:var(--navy);border:0.5px solid var(--line);border-radius:10px;padding:10px;outline:0"></label>'+
    '<label><span class="lb">Total Pages</span><input id="p-tot" type="text" inputmode="numeric" pattern="[0-9]*" value="'+(b.pages||'')+'" style="width:100%;background:var(--navy);border:0.5px solid var(--line);border-radius:10px;padding:10px;outline:0"></label></div>'+
    '<div class="row" style="margin-top:12px"><button class="ob" data-act="progcancel">Cancel</button><button class="pb" data-act="progsave" style="padding:10px;font-size:15px">Save</button></div>';
  }else{
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:500">'+pageText(b)+'</span>'+(p!==null?'<span style="font-weight:500;color:var(--green)">'+p+'%</span>':'')+'</div>'+
    (p!==null?'<div class="bar" style="height:6px;margin:10px 0 12px"><b style="width:'+p+'%"></b></div>':'<div style="height:12px"></div>')+
    '<button class="ob" data-act="progedit">Update Progress</button>';
  }
  h+='</div><div style="margin-top:16px"><div class="lb">Your Rating</div><div class="stars">';
  for(var i=1;i<=5;i++){h+='<button class="star'+(i<=(b.rating||0)?' f':'')+'" data-star="'+i+'" aria-label="'+i+' star'+(i>1?'s':'')+'">'+ico('star',28)+'</button>';}
  h+='<span class="sm" style="margin-left:8px">'+((b.rating||0)?b.rating+' out of 5':'Not Rated')+'</span></div></div>'+
  '<label class="fld"><span class="lb">Notes</span><textarea id="notes" placeholder="Add a Note">'+esc(b.notes||'')+'</textarea></label>'+
  '<div class="center" style="margin-top:20px"><button class="tr" data-act="remove">'+ico('trash',18)+'Remove from Library</button></div>';
  return h;
}
function viewBackup(){
  return '<div class="hd">Backup</div><div class="cd" style="margin-top:20px"><div style="font-weight:500;margin-bottom:6px">Your Books Are Saved on This Phone</div><p class="sm" style="margin:0">Backup and restore are coming in the next steps. Until then, treat anything you add as test data.</p></div>';
}

/* ---------- render ---------- */
function render(){
  var v=$('#view');
  var h=state.view==='library'?viewLibrary():state.view==='add'?viewAdd():state.view==='detail'?viewDetail():viewBackup();
  v.innerHTML=h;
  var showNav=(state.view==='library'||state.view==='backup');
  $('#nav').classList.toggle('hidden',!showNav);
  var ns=document.querySelectorAll('.ni');
  for(var i=0;i<ns.length;i++){ns[i].classList.toggle('on',ns[i].getAttribute('data-go')===state.view);}
  if(state.view==='add'&&state.form==='type'){var t=$('#f-title');if(t&&!state.err){/* no autofocus: avoids iOS zoom jump */}}
}
function go(view){
  state.view=view;state.editProg=false;
  if(view==='add'){state.form='choose';state.err='';}
  if(view==='library'){state.id=null;}
  render();window.scrollTo(0,0);
}
function openSheet(html){
  var l=$('#layer');l.innerHTML='<div class="ov" data-act="closesheet"><div class="sheet" role="dialog">'+html+'</div></div>';
}
function closeSheet(){$('#layer').innerHTML='';}

/* ---------- events ---------- */
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest&&e.target.closest('.ic,.bt,.ni');
  if(el&&!el.disabled){el.classList.add('hit');setTimeout(function(){el.classList.remove('hit');},600);}
});
document.addEventListener('click',function(e){
  var t=e.target;
  var el=t.closest('[data-go],[data-open],[data-filter],[data-star],[data-as],[data-act],[data-set]');
  if(!el){return;}
  if(el.getAttribute('data-act')==='closesheet'){if(t===el)closeSheet();return;}
  if(el.hasAttribute('data-go')){closeSheet();go(el.getAttribute('data-go'));return;}
  if(el.hasAttribute('data-open')){state.id=el.getAttribute('data-open');state.view='detail';state.editProg=false;render();window.scrollTo(0,0);return;}
  if(el.hasAttribute('data-filter')){state.filter=el.getAttribute('data-filter');render();return;}
  if(el.hasAttribute('data-as')){var f=readForm();state.addAs=el.getAttribute('data-as');state.err='';render();writeForm(f);return;}
  if(el.hasAttribute('data-star')){
    var b=byId(state.id);if(!b)return;
    var n=parseInt(el.getAttribute('data-star'),10);
    b.rating=(b.rating===n)?0:n;b.updatedAt=Date.now();dbPut(b);render();return;
  }
  if(el.hasAttribute('data-set')){
    var bk=byId(state.id);if(!bk)return;
    setStatus(bk,el.getAttribute('data-set'));closeSheet();render();return;
  }
  var a=el.getAttribute('data-act');
  if(a==='search'){state.search=!state.search;if(!state.search)state.q='';render();if(state.search){var q=$('#q');if(q)q.focus();}return;}
  if(a==='addback'){if(state.form==='type'){state.form='choose';state.err='';render();}else{go('library');}return;}
  if(a==='typeit'){state.form='type';state.err='';render();return;}
  if(a==='progedit'){state.editProg=true;render();return;}
  if(a==='progcancel'){state.editProg=false;render();return;}
  if(a==='progsave'){
    var pb=byId(state.id);if(!pb)return;
    var cur=parseInt(($('#p-cur').value||'0').replace(/\D/g,''),10)||0;
    var tot=parseInt(($('#p-tot').value||'0').replace(/\D/g,''),10)||0;
    pb.pages=tot;pb.currentPage=(tot>0)?Math.min(cur,tot):cur;pb.updatedAt=Date.now();
    dbPut(pb);state.editProg=false;render();return;
  }
  if(a==='status'){
    var sb=byId(state.id);if(!sb)return;
    var h='<h2>Change Status</h2>';
    ORDER.forEach(function(k){h+='<button class="opt" data-set="'+k+'"><span class="dot" style="background:'+STAT[k].color+'"></span>'+STAT[k].label+(sb.status===k?'<small>Current</small>':'')+'</button>';});
    openSheet(h);return;
  }
  if(a==='remove'){
    openSheet('<h2>Remove This Book?</h2><p class="sm" style="margin:0 0 16px">It will be deleted from this phone. This can\'t be undone.</p><div class="row"><button class="ob" data-act="closesheet2">Cancel</button><button class="pb" data-act="removeyes">Remove</button></div>');return;
  }
  if(a==='closesheet2'){closeSheet();return;}
  if(a==='removeyes'){
    var rb=byId(state.id);
    if(rb){state.books=state.books.filter(function(x){return x.id!==rb.id;});dbDel(rb.id);}
    closeSheet();go('library');toast('Removed from Library');return;
  }
});
function readForm(){var t=$('#f-title');if(!t)return null;return {t:t.value,a:$('#f-author').value,p:$('#f-pages').value};}
function writeForm(f){if(!f)return;var t=$('#f-title');if(!t)return;t.value=f.t;$('#f-author').value=f.a;$('#f-pages').value=f.p;}
document.addEventListener('input',function(e){
  if(e.target.id==='f-title'&&state.err){state.err='';var er=$('#err');if(er)er.textContent='';}
  if(e.target.id==='q'){state.q=e.target.value;var pos=e.target.selectionStart;render();var q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(e.target.id==='notes'){
    var b=byId(state.id);if(!b)return;
    b.notes=e.target.value;b.updatedAt=Date.now();
    clearTimeout(window.__nt);window.__nt=setTimeout(function(){dbPut(b);},400);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addform')return;
  e.preventDefault();
  var title=$('#f-title').value.trim();
  if(!title){state.err='Enter a title to continue.';var er=$('#err');if(er)er.textContent=state.err;$('#f-title').focus();return;}
  var pages=parseInt(($('#f-pages').value||'0').replace(/\D/g,''),10)||0;
  var now=Date.now();
  var b={id:uid(),title:title,author:$('#f-author').value.trim(),pages:pages,status:state.addAs,currentPage:0,rating:0,notes:'',addedAt:now,updatedAt:now};
  if(b.status==='reading')b.startedAt=now;
  if(b.status==='finished'){b.startedAt=now;b.finishedAt=now;if(pages>0)b.currentPage=pages;}
  state.books.push(b);dbPut(b);
  state.addAs='toread';state.filter='all';state.q='';state.search=false;state.err='';
  go('library');toast('Added to Library');
});
window.addEventListener('pagehide',function(){var n=$('#notes');if(n&&state.id){var b=byId(state.id);if(b){b.notes=n.value;dbPut(b);}}});

/* ---------- start ---------- */
function start(){
  render();
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
  openDB().then(function(d){db=d;return dbAll();}).then(function(rows){state.books=rows;render();})
  .catch(function(){memoryOnly=true;render();toast('This browser mode can\'t save books');});
}
start();
})();
</script>
</body>
</html>
