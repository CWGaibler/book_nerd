<style>
:root{--navy:#001F5F;--card:#00296B;--line:#00478E;--deep:#00033C;--blue:#00BDF6;--gold:#FFB500;--green:#42BB37;--dblue:#009CC6;color-scheme:dark;--mo:900ms;--mc:765ms;--do:250ms;--dc:200ms;--fade:950ms;--eo:cubic-bezier(.3,.05,.2,1);--ec:cubic-bezier(.4,0,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--navy);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:#fff}
.tb{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100vh}
#topbar{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0}
#topbar>div{display:flex;align-items:center;min-height:36px}
#view{padding:0 16px 110px;display:flow-root}
.ghost{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
input[type=search]{-webkit-appearance:none;appearance:none}
.top{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.slot{width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-right:-8px}
.slot .ic{margin:0}
.pt{font-size:17px;font-weight:500;margin:14px 0 0;line-height:1.3}
.cnt{font-size:13px;margin:12px 0 0}
.badge{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,3,60,.85);display:flex;align-items:center;justify-content:center;color:#fff}
.own{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:12px;text-align:left;margin-top:16px;font-size:15px;color:#fff}
.own b{font-weight:500;display:block}
.own .hint{display:block;font-size:12px;margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.own.on .sw{background:var(--blue)}
.own.on .sw::after{left:21px}
.ic{color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin:-7px}
.ic.hit,.ic.on{color:var(--blue)}
.cd{background:var(--card);border-radius:14px;padding:12px}
.lb{font-size:12px;color:#fff;margin:0 0 6px}
.sm{font-size:13px;color:#fff}
.chips{display:flex;gap:6px;margin:14px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--card);color:#fff;flex:none;border:1px solid transparent}
.ch.sel{background:var(--line);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.cv{aspect-ratio:2/3;padding:8px;display:flex;align-items:flex-end;font-size:12px;line-height:1.25;font-weight:500;border-radius:4px;background:var(--c);color:var(--t,#fff);overflow:hidden;word-break:break-word;width:100%}
.cv span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px}
.bar b{display:block;height:100%;border-radius:3px;background:var(--green)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);border-top:0.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 0 10px}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#fff;min-width:72px}
.ni svg{color:#fff}
.ni.on svg,.ni.hit svg{color:var(--blue)}
.ni.on{font-weight:500}
.bt{background:var(--card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;font-size:16px;color:#fff;width:100%;text-align:left}
.bt svg{color:#fff}
.bt.hit svg{color:var(--blue)}
.bt small{margin-left:auto;font-size:12px}
.bt[disabled]{opacity:.6;cursor:default}
.bt.c{justify-content:center;text-align:center;border:1px solid transparent}
.pb{display:block;width:100%;background:var(--line);background-image:linear-gradient(180deg,#0A5AA6 0%,#00478E 55%,#003C7A 100%);border:1px solid var(--blue);color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:16px;font-weight:500}
.ob{display:block;width:100%;border:0.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:15px;color:#fff}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;color:var(--deep)}
.fld{display:block;margin-top:16px}
.fld input,.fld textarea{width:100%;background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px;outline:0}
.fld input:focus,.fld textarea:focus{border-color:var(--blue)}
.fld textarea{resize:none;min-height:96px;line-height:1.4}
.err{color:var(--gold);font-size:14px;margin:8px 0 0;min-height:20px}
.row{display:flex;gap:8px}
.row>*{flex:1}
h2{font-size:18px;font-weight:500;margin:0 0 6px}
.center{text-align:center}
.stars{display:flex;align-items:center;gap:2px;margin-left:-4px}
.star{padding:4px;color:var(--line)}
.star.f{color:var(--gold)}
.star.f svg{fill:var(--gold)}
.tr{display:inline-flex;align-items:center;gap:6px;padding:10px;font-size:14px;color:#fff}
.toast{display:flex;align-items:center;gap:14px;z-index:40;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--line);border:0.5px solid var(--blue);border-radius:999px;padding:8px 16px;font-size:14px;max-width:90%}
.ov{position:fixed;inset:0;background:rgba(0,3,60,.7);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:0.5px solid var(--line)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-top:0.5px solid var(--line);font-size:16px;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.opt small{margin-left:auto;font-size:12px}
.logo{display:block;height:28px;width:auto}
.empty{text-align:center;padding:48px 8px}
.empty p{margin:0 0 20px}
.cv{position:relative}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:3px}
.cv img+span{visibility:hidden}
.cam{margin-top:16px;border-radius:14px;overflow:hidden;background:var(--deep);min-height:96px}
#reader{border:0!important;width:100%}
#reader video{border-radius:14px}
.stat{min-height:24px;margin:12px 0 0;font-size:14px;text-align:center}
.stat.e{color:var(--gold)}
.big{width:128px;margin:20px auto 0}
.lk{display:block;margin:14px auto 0;font-size:14px;padding:8px}
.hidden{display:none!important}
body.noscroll{overflow:hidden}
@keyframes dimIn{from{background-color:rgba(0,3,60,0)}}
@keyframes dimOut{to{background-color:rgba(0,3,60,0)}}
@keyframes slideUp{from{transform:translateY(102%)}to{transform:none}}
@keyframes slideDown{from{transform:none}to{transform:translateY(102%)}}
.scrim2.in,.ov.in{animation:dimIn var(--do) ease-out}
.scrim2.in .card2,.ov.in .sheet{animation:slideUp var(--mo) var(--eo)}
.scrim2.out,.ov.out{animation:dimOut var(--dc) ease-in forwards;pointer-events:none}
.scrim2.out .card2,.ov.out .sheet{animation:slideDown var(--mc) var(--ec) forwards}
@media (prefers-reduced-motion:reduce){.scrim2,.card2,.ov,.sheet{animation:none!important}}

.pill.o{display:inline-flex;align-items:center;gap:5px;background:transparent;color:#fff;border:1px solid var(--line)}

.syn{margin:0;font-size:14px;line-height:1.5}

.lnk.l{margin:6px 0 0;text-align:left;padding:4px 0}
.toast-act{color:#fff;font-weight:500;text-decoration:underline;padding:4px 6px;font-size:14px}

.sec{font-size:14px;font-weight:500;margin:20px 0 8px}
.lnk{display:block;margin:14px auto 0;font-size:13px;color:#fff;text-decoration:underline;padding:8px}

.fb.hit svg{color:var(--blue)}
.ac{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 10px 7px 14px;font-size:13px;font-weight:500;color:#fff}

.spw{flex:1;min-width:0;overflow:hidden}

.spw input::placeholder{color:#ADB1B1;-webkit-text-fill-color:#ADB1B1;opacity:1}

.sp.has .spx{display:flex}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.scrim2{position:fixed;inset:0;background:rgba(0,3,60,.72);z-index:25;display:flex;align-items:flex-end;justify-content:center}

.chdr{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.chdr b{font-size:17px;font-weight:500}
.xb{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:#fff;border-radius:50%}
.xb.hit,.xb:active{color:var(--blue)}
.cbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.card2 .cd,.card2 .own,.sheet .ch,.card2 .ch{background:var(--navy)}
.sheet{max-height:92%;overflow-y:auto}
.sheet .fld input,.sheet .fld textarea{background:var(--navy)}
.card2 .ch.sel,.sheet .ch.sel{background:var(--line)}
.card2 .fld input,.card2 .fld textarea{background:var(--navy)}
#cel{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
#celx{position:fixed;inset:0;z-index:36;background:transparent;touch-action:none}
#wl{position:fixed;inset:0;z-index:60;background:var(--navy);display:flex;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}

.wlg{display:flex;flex-direction:column;align-items:center;flex:none;position:relative;transform-origin:50% 50%}
.wmk{display:block;width:104px;height:96.57px;overflow:visible}

.wtg{position:absolute;left:50%;top:100%;width:260px;margin:12px 0 0 -130px;text-align:center;font-size:14px;line-height:1.3;color:#fff}
.wcard{width:100%;max-width:440px;margin-top:28px;background:var(--card);border-radius:14px;padding:20px;visibility:hidden;pointer-events:none}
.wcard.on{visibility:visible;pointer-events:auto}
.wcard h2{font-size:20px;font-weight:500;margin:0}
.wcard .wq{font-size:16px;font-weight:500;margin:10px 0 2px}
.wcard .fld input{background:var(--navy)}

/* ---------- storage ---------- */
function openDB(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej(new Error('no indexedDB'));return;}
  var r=indexedDB.open('bookmark',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('books',{keyPath:'id'});};
  r.onsuccess=function(){res(r.result);};
  r.onerror=function(){rej(r.error);};
});}
function dbAll(){return new Promise(function(res,rej){

});}
function dbPut(b){if(memoryOnly)return;try{var t=db.transaction('books','readwrite');t.objectStore('books').put(b);t.onerror=function(){toast('Could not save that change');};}catch(e){toast('Could not save that change');}}

function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function coverHTML(b,extra,bag){

function fmtDate(ts){
  var d=new Date(ts),n=new Date();

function pct(b){return b.pages>0?Math.min(100,Math.round((b.currentPage||0)/b.pages*100)):null;}

function toast(msg,act){

  if(act){var bt=document.createElement('button');bt.type='button';bt.className='toast-act';bt.textContent=act.label;bt.addEventListener('click',function(){act.fn();t.remove();});t.appendChild(bt);}
  document.body.appendChild(t);

function setStatus(b,st){
  var now=Date.now();
  if(b.status==='finished'&&st!=='finished'){b.currentPage=0;if(st==='reading')b.startedAt=now;else delete b.startedAt;}
  b.status=st;
  if(st==='reading'&&!b.startedAt)b.startedAt=now;
  if(st==='finished'){b.finishedAt=now;if(b.pages>0)b.currentPage=b.pages;}
  b.updatedAt=now;dbPut(b);
}

function isbn13to10(i){
  if(!/^978[0-9]{10}$/.test(i))return null;
  var core=i.slice(3,12),s=0;
  for(var k=0;k<9;k++)s+=(10-k)*parseInt(core.charAt(k),10);
  var c=(11-s%11)%11;
  return core+(c===10?'X':String(c));
}
function buyURL(b){

    if(/^[0-9]{9}[0-9Xx]$/.test(b.isbn))return base+'dp/'+b.isbn.toUpperCase();
    var d=isbn13to10(b.isbn);
    return d?base+'dp/'+d:base+'s?k='+encodeURIComponent(b.isbn)+'&i=stripbooks';
  }
  return base+'s?k='+encodeURIComponent((b.title+' '+(b.author||'')).trim())+'&i=stripbooks';
}

/* ---------- motion ---------- */

  fadeAnims.forEach(function(a){try{a.cancel();}catch(e){}});fadeAnims=[];

}
function makeGhost(v){

  inner.innerHTML=v.innerHTML;
  var ids=inner.querySelectorAll('[id]');for(var i=0;i<ids.length;i++)ids[i].removeAttribute('id');
  var vs=inner.querySelectorAll('video');for(var j=0;j<vs.length;j++)vs[j].parentNode.removeChild(vs[j]);

function startFade(v,g){

    fadeAnims[1].finished.then(function(){if(ghostEl===mine)endFade();}).catch(function(){});
  }catch(e){endFade();}
}

/* ---------- scanning and lookup ---------- */
function setStat(msg,err){

}
function safeStop(s){
  var p=null;
  try{p=s.stop();}catch(e){p=null;}
  return Promise.resolve(p).catch(function(){}).then(function(){try{s.clear();}catch(e){}});

function stopScan(){

function startScan(){
  handled=false;

  if(typeof Html5Qrcode==='undefined'){setStat('The scanner did not load. Check your connection, or use Enter ISBN or Search by Title.',true);return;}
  setStat('Starting the camera\u2026');
  var s=new Html5Qrcode('reader',{
    formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A],
    experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});

    if(token!==scanToken){safeStop(s);return;}

    if(token!==scanToken)return;
    scanner=null;
    var name=err&&err.name?err.name:'',msg=String(err);

    else if(name==='NotFoundError'||/Requested device not found/i.test(msg)){setStat('No camera was found. Use Enter ISBN or Search by Title.',true);}
    else{setStat('The camera did not start. Use Enter ISBN or Search by Title.',true);}
  });
}
function onScan(text){
  if(handled)return;
  var code=String(text).replace(/[^0-9Xx]/g,'');

}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
function yearOf(s){var m=String(s||'').match(/(1[5-9]|20)\d\d/);return m?m[0]:'';}
function lookupOL(isbn){
  return fetch('https://openlibrary.org/api/books?bibkeys=ISBN:'+isbn+'&format=json&jscmd=data').then(function(r){return r.json();}).then(function(j){
    var b=j['ISBN:'+isbn];if(!b)return null;
    return {title:b.title||'',author:(b.authors||[]).map(function(a){return a.name;}).join(', '),pages:b.number_of_pages||0,year:yearOf(b.publish_date),cover:b.cover?(b.cover.medium||b.cover.large||b.cover.small||''):''};
  });
}
function lookupGB(isbn){
  return fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn).then(function(r){return r.json();}).then(function(j){
    var v=j.items&&j.items[0]&&j.items[0].volumeInfo;if(!v)return null;
    var img=v.imageLinks?(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail||''):'';
    return {title:v.title||'',author:(v.authors||[]).join(', '),pages:v.pageCount||0,year:yearOf(v.publishedDate),cover:img.replace('http://','https://')};
  });

function findBook(isbn){
  return withTimeout(lookupOL(isbn),8000).catch(function(){return null;}).then(function(b){
    if(b&&b.title)return b;
    return withTimeout(lookupGB(isbn),8000).catch(function(){return null;}).then(function(g){return (g&&g.title)?g:null;});
  });
}
function doLookup(isbn){
  closeSheet();
  var ex=null;for(var i=0;i<state.books.length;i++){if(state.books[i].isbn===isbn){ex=state.books[i];break;}}
  if(ex){stopScan();toast('Already in Your Library');state.id=ex.id;openCard('detail');return;}
  setStat('Found ISBN '+isbn+'. Looking up the book\u2026');
  findBook(isbn).then(function(book){
    state.isbn=isbn;state.addAs='toread';state.addOwned=true;state.from='';
    if(book){book.isbn=isbn;book.status='toread';state.found=book;state.nf='';}else{state.found=null;state.nf=isbn;}

function pickIsbn(arr){if(!arr)return '';for(var i=0;i<arr.length;i++){if(/^97[89][0-9]{10}$/.test(arr[i]))return arr[i];}return '';}
function searchOL(q){
  return fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=20&fields=key,title,author_name,first_publish_year,cover_i,isbn,number_of_pages_median').then(function(r){return r.json();}).then(function(j){
    return (j.docs||[]).map(function(d){return {title:d.title||'',author:(d.author_name||[]).slice(0,2).join(', '),year:d.first_publish_year?String(d.first_publish_year):'',pages:d.number_of_pages_median||0,cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':'',isbn:pickIsbn(d.isbn),olKey:/^\/works\/OL\d+W$/.test(d.key||'')?d.key:''};}).filter(function(x){return x.title;});
  });
}
function searchGB(q){

    return (j.items||[]).map(function(it){

    }).filter(function(x){return x.title;});
  });

function searchBooks(q){

    if(list.length)return list;
    return withTimeout(searchGB(q),10000).then(function(g){return g;},function(e){if(olFailed)throw e;return [];});

function doSearch(q){

function pickResult(i){

  }

function cleanSynopsis(raw){
  if(raw&&typeof raw==='object')raw=raw.value;
  if(typeof raw!=='string')return '';
  var s=raw;
  if(/<[a-z][\s\S]*>/i.test(s)){
    try{s=new DOMParser().parseFromString(s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n'),'text/html').body.textContent||'';}
    catch(e){s=s.replace(/<[^>]+>/g,' ');}
  }
  s=s.split(/\r?\n\s*(?:-{4,}|_{4,}|={4,})/)[0];
  s=s.split(/\r?\n\s*(?:Contains:|Also contained in|See also|Source:|\[\d+\]:|Previously published as)/i)[0];
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\[\d+\]/g,'$1').replace(/\(\[source\]\[\d+\]\)/gi,'');
  s=s.replace(/^#+\s*/gm,'').replace(/\*+/g,'').replace(/(^|\s)_+(?=\S)|(\S)_+(?=\s|[.,;:!?]|$)/g,'$1$2');
  s=s.replace(/\s+/g,' ').trim();
  if(s.length>1200){
    var cut=s.slice(0,1200),i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('! '),cut.lastIndexOf('? '));
    s=(i>500)?cut.slice(0,i+1):cut.replace(/\s+\S*$/,'')+'\u2026';

function jget(u){
  return withTimeout(fetch(u).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('http '+r.status);return r.json();}),10000);
}
function fetchSynopsis(b){
  var failed=false;

  function viaWork(key){return safe(jget('https://openlibrary.org'+key+'.json')).then(function(w){return w?cleanSynopsis(w.description):'';});}
  var chain=Promise.resolve('');
  if(b.olKey){chain=viaWork(b.olKey);}
  else if(b.isbn){
    chain=safe(jget('https://openlibrary.org/isbn/'+b.isbn+'.json')).then(function(ed){
      if(!ed)return '';
      var d=cleanSynopsis(ed.description);if(d)return d;
      var wk=ed.works&&ed.works[0]&&ed.works[0].key;return wk?viaWork(wk):'';
    });
  }
  return chain.then(function(txt){
    if(txt||!b.isbn)return txt;
    return safe(jget('https://www.googleapis.com/books/v1/volumes?q=isbn:'+b.isbn)).then(function(g){
      var v=g&&g.items&&g.items[0]&&g.items[0].volumeInfo;return v?cleanSynopsis(v.description):'';
    });

var synBusy={};
function ensureSynopsis(b){

  if(b.synopsisChecked&&Date.now()-b.synopsisChecked<7*864e5)return;
  synBusy[b.id]=true;
  if(state.card==='detail'&&state.id===b.id)renderCard();
  fetchSynopsis(b).then(function(r){
    delete synBusy[b.id];
    if(r.text){b.synopsis=r.text;delete b.synopsisChecked;dbPut(b);}
    else if(!r.failed){b.synopsisChecked=Date.now();dbPut(b);}
    if(state.card==='detail'&&state.id===b.id)renderCard();
  });
}
function makeBook(f){

  if(b.status==='finished'){b.startedAt=now;b.finishedAt=now;if(b.pages>0)b.currentPage=b.pages;}
  state.books.push(b);dbPut(b);ensureSynopsis(b);
  state.addAs='toread';state.addOwned=true;state.filter='all';state.own='any';state.q='';state.search=false;state.err='';state.found=null;

function pad(n){return (n<10?'0':'')+n;}
function backupName(){var d=new Date();return 'book-nerd-backup-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';}
function saveBackup(){
  var payload={app:'bookmark',version:1,exportedAt:new Date().toISOString(),build:BUILD,books:state.books},bn=userName();
  if(bn)payload.name=bn;
  var data=JSON.stringify(payload,null,2);
  var name=backupName();
  var done=function(){lsSet('bm_last_backup',String(Date.now()));toast('Backup Saved');if(state.view==='backup')render();};
  var file=null;
  try{file=new File([data],name,{type:'application/json'});}catch(e){file=null;}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Book Nerd Backup'}).then(done).catch(function(e){
      if(e&&e.name==='AbortError')return;
      downloadBackup(data,name,done);
    });
    return;
  }
  downloadBackup(data,name,done);
}
function downloadBackup(data,name,done){
  try{
    var url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(url);},2000);
    done();
  }catch(e){toast('Could not save the backup');}
}
function cleanBook(x){
  if(!x||typeof x!=='object')return null;
  var title=typeof x.title==='string'?x.title.trim():'';
  if(!title||typeof x.id!=='string'||!x.id)return null;
  var num=function(v){v=Number(v);return isFinite(v)&&v>0?Math.floor(v):0;};
  var now=Date.now();
  var b={id:x.id.slice(0,64),title:title.slice(0,300),author:typeof x.author==='string'?x.author.slice(0,300):'',
    pages:num(x.pages),status:STAT[x.status]?x.status:'toread',currentPage:num(x.currentPage),
    rating:Math.min(5,num(x.rating)),notes:typeof x.notes==='string'?x.notes.slice(0,20000):'',
    addedAt:num(x.addedAt)||now,updatedAt:num(x.updatedAt)||now};
  if(x.owned===false)b.owned=false;
  if(typeof x.synopsis==='string'&&x.synopsis.trim())b.synopsis=x.synopsis.slice(0,2000);
  if(typeof x.olKey==='string'&&/^\/works\/OL\d+W$/.test(x.olKey))b.olKey=x.olKey;
  if(typeof x.review==='string'&&x.review.trim())b.review=x.review.slice(0,20000);
  if(num(x.startedAt))b.startedAt=num(x.startedAt);
  if(num(x.finishedAt))b.finishedAt=num(x.finishedAt);
  if(typeof x.isbn==='string'&&/^[0-9Xx]{10,13}$/.test(x.isbn))b.isbn=x.isbn;
  if(typeof x.coverUrl==='string'&&/^https?:\/\//i.test(x.coverUrl))b.coverUrl=x.coverUrl.slice(0,500);
  if(typeof x.year==='string'&&/^\d{4}$/.test(x.year))b.year=x.year;
  return b;
}
function handleRestoreFile(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var data;
    try{data=JSON.parse(String(r.result));}catch(e){toast('That file is not a Book Nerd backup');return;}
    var list=data&&data.app==='bookmark'&&Array.isArray(data.books)?data.books:null;
    if(!list){toast('That file is not a Book Nerd backup');return;}
    var books=[];list.forEach(function(x){var c=cleanBook(x);if(c)books.push(c);});
    if(!books.length){toast('That backup has no books in it');return;}
    var fresh=0,newer=0;
    books.forEach(function(b){var e=byId(b.id);if(!e)fresh++;else if(b.updatedAt>e.updatedAt)newer++;});
    pendingRestore=books;pendingName=cleanName(data.name);
    openSheet('<h2>Restore Books?</h2><p class="sm" style="margin:0 0 6px">The backup has '+books.length+' book'+(books.length===1?'':'s')+'.</p>'+
      '<p class="sm" style="margin:0 0 16px">'+fresh+' new to this phone'+(newer?', '+newer+' updated':'')+'. Books already on this phone are kept, unless the backup has a newer copy.</p>'+
      '<div class="row"><button class="ob" data-act="closesheet2">Cancel</button><button class="pb" data-act="restoreyes">Restore</button></div>');
  };
  r.onerror=function(){toast('Could not read that file');};
  r.readAsText(file);
}
function applyRestore(){
  var n=0;
  (pendingRestore||[]).forEach(function(b){
    var e=byId(b.id);
    if(!e){state.books.push(b);dbPut(b);n++;}
    else if(b.updatedAt>e.updatedAt){var i=state.books.indexOf(e);state.books[i]=b;dbPut(b);n++;}
  });
  pendingRestore=null;
  if(pendingName&&!userName()){lsSet('bm_name',pendingName);lsSet('bm_name_done','1');}
  pendingName='';closeSheet();render();
  toast(n?('Restored '+n+' Book'+(n===1?'':'s')):'Nothing New to Restore');
}
function checkUpdate(){
  if(!BUILD||!window.fetch)return;
  fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    var m=t.match(/<meta name="build" content="([^"]+)"/);
    if(m&&m[1]!==BUILD){
      var key='bm_reload_'+m[1];
      try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');}catch(e){return;}
      location.replace(location.pathname+'?b='+encodeURIComponent(m[1]));
    }
  }).catch(function(){});
}

/* ---------- celebration (Finished Reading) ---------- */
var celeb={on:false,t:[]};
function celebAt(fn,ms){celeb.t.push(setTimeout(fn,ms));}
function celebStop(){
  for(var i=0;i<celeb.t.length;i++)clearTimeout(celeb.t[i]);
  celeb.t=[];celeb.on=false;
  var a=$('#cel'),b=$('#celx');
  if(a&&a.parentNode)a.parentNode.removeChild(a);
  if(b&&b.parentNode)b.parentNode.removeChild(b);
}
function celebBurst(host,x0,y0,o,m){
  var cols=['#FFB500','#42BB37','#00BDF6','#009CC6'],g=800*m.sy;
  for(var i=0;i<44;i++){
    var a=(o.a0+Math.random()*(o.a1-o.a0))*Math.PI/180,v=o.v0+Math.random()*(o.v1-o.v0);
    var vx=Math.cos(a)*v*m.sx,vy=Math.sin(a)*v*m.sy,T=1.7+Math.random()*.7,rot=(Math.random()-.5)*1440,circ=Math.random()<.3;
    var e=document.createElement('div');
    e.style.cssText='position:absolute;left:0;top:0;background:'+cols[i%4]+';width:'+(circ?9:12)+'px;height:'+(circ?9:7)+'px;border-radius:'+(circ?'50%':'1px');
    host.appendChild(e);
    var kf=[];
    for(var j=0;j<=18;j++){
      var t=T*j/18,x=x0+vx*(1-Math.exp(-o.k*t))/o.k,y=y0+vy*t+.5*g*t*t;
      kf.push({offset:j/18,opacity:j/18>.7?1-(j/18-.7)/.3:1,transform:'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(rot*j/18).toFixed(0)+'deg)'});
    }
    e.animate(kf,{duration:T*1000*m.S,delay:Math.random()*100*m.S,fill:'both',easing:'linear'});
  }
}
function celebrate(done){
  if(reduced()||!document.documentElement.animate){done();return;}
  celebStop();
  var S=1.4,W=window.innerWidth,H=window.innerHeight,cw=Math.min(W,480),cl=(W-cw)/2;
  var m={S:S,sx:cw/390,sy:H/700},at=1250*S;
  var host=document.createElement('div');host.id='cel';host.setAttribute('aria-hidden','true');
  var shield=document.createElement('div');shield.id='celx';
  celeb.on=true;
  try{
    document.body.appendChild(host);document.body.appendChild(shield);
    var d=document.createElement('div');d.style.cssText='position:absolute;inset:0;background:rgba(0,3,60,.8)';
    host.appendChild(d);
    d.animate([{opacity:0},{opacity:1}],{duration:200*S,fill:'both'});
    celebAt(function(){d.animate([{opacity:1},{opacity:0}],{duration:300*S,fill:'forwards'});},at);
    var rg=document.createElement('div');
    rg.style.cssText='position:absolute;left:'+(W/2-55)+'px;top:'+(H*.43-55)+'px;width:110px;height:110px';
    rg.innerHTML='<svg viewBox="0 0 110 110" width="110" height="110" aria-hidden="true"><circle class="pu" cx="55" cy="55" r="44" fill="none" stroke="#00BDF6" stroke-width="2" style="transform-box:fill-box;transform-origin:center"/><circle class="rg" cx="55" cy="55" r="44" fill="#00296B" stroke="#00BDF6" stroke-width="3.5" stroke-dasharray="276.5" transform="rotate(-90 55 55)"/><path class="ck" d="M34 57l15 15 28-30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70"/></svg>';
    host.appendChild(rg);
    rg.querySelector('.rg').animate([{strokeDashoffset:276.5},{strokeDashoffset:0}],{duration:450*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.ck').animate([{strokeDashoffset:70},{strokeDashoffset:0}],{duration:300*S,delay:380*S,easing:'ease-out',fill:'both'});
    rg.querySelector('.pu').animate([{transform:'scale(1)',opacity:0},{transform:'scale(1)',opacity:.7,offset:.01},{transform:'scale(1.5)',opacity:0}],{duration:500*S,delay:620*S,easing:'ease-out',fill:'both'});
    rg.animate([{transform:'scale(.85)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260*S,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'both'});
    rg.animate([{opacity:1},{opacity:0}],{duration:250*S,delay:1000*S,fill:'both'});
    var by=H-28*m.sy;
    celebAt(function(){celebBurst(host,cl+16*m.sx,by,{a0:-92,a1:-58,v0:720,v1:1000,k:1.8},m);},620*S);
    celebAt(function(){celebBurst(host,cl+cw-16*m.sx,by,{a0:-122,a1:-88,v0:720,v1:1000,k:1.8},m);},970*S);
  }catch(err){celebStop();done();return;}
  celebAt(function(){
    var x=$('#celx');if(x&&x.parentNode)x.parentNode.removeChild(x);
    celeb.on=false;
    done();
  },at);
  celebAt(function(){var h=$('#cel');if(h&&h.parentNode)h.parentNode.removeChild(h);},3900*S);
}

  if(a==='closesheet2'){closeSheet();return;}
  if(a==='editname'){
    openSheet('<h2>Your Name</h2><p class="sm" style="margin:0">We use it to greet you on Home. Leave it empty to remove it.</p><div class="fld"><input id="nm-in" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" placeholder="Your First Name" aria-label="Your first name" value="'+esc(userName())+'"></div><div class="row" style="margin-top:16px"><button class="ob" data-act="closesheet2">Cancel</button><button class="pb" data-act="nmsave" style="padding:10px;font-size:15px">Save</button></div>');
    return;
  }
  if(a==='nmsave'){
    var ni=$('#nm-in');lsSet('bm_name',cleanName(ni?ni.value:''));lsSet('bm_name_done','1');
    closeSheet();render();toast('Name Saved');return;
  }
  if(a==='removeyes'){
    var rb=byId(state.id);
    if(rb){state.books=state.books.filter(function(x){return x.id!==rb.id;});dbDel(rb.id);}
    closeSheet();closeCard();toast('Removed from Library');return;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='q'){e.preventDefault();e.target.blur();return;}
  if(e.key==='Escape'&&state.card&&!$('#layer .ov:not(.out)')){closeCard();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.hasAttribute('data-open')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){state.q=e.target.value;updateLib();return;}
  if(e.target.id==='notes'){
    var b=byId(state.id);if(!b)return;
    b.notes=e.target.value;b.updatedAt=Date.now();
    clearTimeout(window.__nt);window.__nt=setTimeout(function(){dbPut(b);},400);
  }
  if(e.target.id==='review'){
    var rbk=byId(state.id);if(!rbk)return;
    if(e.target.value)rbk.review=e.target.value;else delete rbk.review;
    rbk.updatedAt=Date.now();
    clearTimeout(window.__rt);window.__rt=setTimeout(function(){dbPut(rbk);},400);
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='restorefile'){handleRestoreFile(e.target.files&&e.target.files[0]);}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='sform'){
    e.preventDefault();
    var q=($('#sq').value||'').trim();
    if(q.length<2)return;
    try{document.activeElement.blur();}catch(x){}
    doSearch(q);return;
  }
  if(e.target.id==='isbnform'){
    e.preventDefault();
    var code=($('#isbn-in').value||'').replace(/[^0-9Xx]/g,'');
    if(!/^97[89][0-9]{10}$/.test(code)){$('#isbn-err').textContent='Enter a 13-digit ISBN that starts with 978 or 979.';return;}
    doLookup(code);return;
  }
});
window.addEventListener('pagehide',function(){var n=$('#notes'),rv=$('#review');if((n||rv)&&state.id){var b=byId(state.id);if(b){if(n)b.notes=n.value;if(rv){if(rv.value)b.review=rv.value;else delete b.review;}dbPut(b);}}});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='nm-in'){e.preventDefault();var sv=document.querySelector('[data-act=nmsave]');if(sv)sv.click();}
});

/* ---------- welcome (first open, and every cold start) ---------- */
var WM_VB='39 5.5 101.5 17.2',wl=null,wlT=[];
function wlAt(fn,ms){wlT.push(setTimeout(fn,ms));}
function wlClose(fade){
  if(!wl)return;
  var el=wl;wl=null;
  for(var i=0;i<wlT.length;i++)clearTimeout(wlT[i]);wlT=[];
  if(fade>0&&el.animate&&!reduced()){
    var a=el.animate([{opacity:1},{opacity:0}],{duration:fade,fill:'forwards'});
    a.onfinish=function(){if(el.parentNode)el.parentNode.removeChild(el);};
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},fade+100);
  }else if(el.parentNode){el.parentNode.removeChild(el);}
}
function wlLogo(big){
  var t=document.createElement('div');t.innerHTML=LOCKUP;
  var outer=t.firstChild,mk=outer.querySelector('svg'),ns='http://www.w3.org/2000/svg',i,paths=[];
  for(i=0;i<outer.childNodes.length;i++){var nd=outer.childNodes[i];if(nd.nodeName&&nd.nodeName.toLowerCase()==='path')paths.push(nd);}
  mk.removeAttribute('x');mk.removeAttribute('y');mk.removeAttribute('width');mk.removeAttribute('height');
  mk.setAttribute('class','wmk');mk.setAttribute('aria-hidden','true');
  var rs=mk.querySelectorAll('rect');
  var defs=document.createElementNS(ns,'defs'),cp=document.createElementNS(ns,'clipPath'),cr=document.createElementNS(ns,'rect'),g=document.createElementNS(ns,'g');
  cp.setAttribute('id','wlclip');cr.setAttribute('x','10');cr.setAttribute('y','10');cr.setAttribute('width','80');cr.setAttribute('height','59.5');
  cp.appendChild(cr);defs.appendChild(cp);mk.insertBefore(defs,mk.firstChild);
  g.setAttribute('clip-path','url(#wlclip)');mk.insertBefore(g,rs[4]);
  for(i=0;i<4;i++)g.appendChild(rs[i]);
  rs[4].style.transformBox='fill-box';rs[4].style.transformOrigin='center';
  var wm=document.createElementNS(ns,'svg');wm.setAttribute('viewBox',WM_VB);wm.setAttribute('class','wwm');wm.setAttribute('aria-hidden','true');
  for(i=0;i<paths.length;i++)wm.appendChild(paths[i]);
  var box=document.createElement('div');box.className='wlg'+(big?' big':'');box.setAttribute('role','img');box.setAttribute('aria-label','Book Nerd');
  box.appendChild(mk);box.appendChild(wm);
  return {box:box,spines:[rs[0],rs[1],rs[2],rs[3]],shelf:rs[4],wm:wm};
}
function wlRise(p,S,k){
  var H=[36,44,32,40];
  for(var i=0;i<4;i++)p.spines[i].animate([{transform:'translateY('+(H[i]+1)+'px)'},{transform:'translateY(0)'}],{duration:520*S*k,delay:(140+i*110)*S*k,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'both'});
  p.shelf.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:300*S*k,easing:'ease-out',fill:'both'});
}
function wlFade(el,S,delay,dur,dy){
  return el.animate([{opacity:0,transform:'translateY('+dy+'px)'},{opacity:1,transform:'translateY(0)'}],{duration:dur*S,delay:delay*S,easing:'cubic-bezier(.3,.05,.2,1)',fill:'both'});
}
function wlSplash(){
  try{sessionStorage.setItem('bm_splash','1');}catch(e){}
  var S=1.4,p=wlLogo(true),el=document.createElement('div');
  el.id='wl';el.className='wsp';el.setAttribute('aria-hidden','true');
  el.appendChild(p.box);document.body.appendChild(el);wl=el;
  wlRise(p,S,.8);
  wlFade(p.wm,S,600,400,10);
  wlAt(function(){wlClose(400*S);},1100*S);
  el.addEventListener('pointerdown',function(){wlClose(200);});
}
function wlFirst(){
  try{sessionStorage.setItem('bm_splash','1');}catch(e){}
  var S=1.4,anim=!reduced()&&!!document.documentElement.animate,p=wlLogo(false),el=document.createElement('div');
  el.id='wl';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Welcome to Book Nerd');
  var card=document.createElement('div');card.className='wcard';
  card.innerHTML='<h2>Welcome to Book Nerd!</h2><div class="wq">What Should We Call You?</div><p class="sm" style="margin:0">We will use it to greet you within the app.</p><div class="fld"><input id="wl-in" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" placeholder="Your First Name" aria-label="Your first name"></div><p class="err" id="wl-err" role="alert"></p><button class="pb" id="wl-go" type="button">Continue</button><button class="lnk" id="wl-skip" type="button">Skip for Now</button>';
  el.appendChild(p.box);el.appendChild(card);
  var SC=150/104,tg=null;
  if(anim){
    el.className='wcen';card.style.display='none';p.box.style.transform='scale('+SC+')';
    tg=document.createElement('p');tg.className='wtg';tg.textContent='Your Books, All in One Place';p.box.appendChild(tg);
  }
  document.body.appendChild(el);wl=el;
  function done(name){
    lsSet('bm_name_done','1');if(name)lsSet('bm_name',name);
    render();wlClose(anim?500*S:0);
  }
  function go(){
    var inp=document.getElementById('wl-in'),v=cleanName(inp.value);
    if(!v){document.getElementById('wl-err').textContent='Enter a name, or tap Skip for Now.';inp.focus();return;}
    done(v);
  }
  document.getElementById('wl-go').addEventListener('click',go);
  document.getElementById('wl-skip').addEventListener('click',function(){done('');});
  document.getElementById('wl-in').addEventListener('input',function(){document.getElementById('wl-err').textContent='';});
  document.getElementById('wl-in').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();go();}});
  if(!anim){card.className='wcard on';return;}
  wlRise(p,S,1);
  wlFade(p.wm,S,900,500,12);
  wlFade(tg,S,1300,500,12);
  wlAt(function(){
    tg.animate([{opacity:1},{opacity:0}],{duration:300*S,fill:'forwards'});
    var a=p.box.getBoundingClientRect();
    p.box.style.transform='';el.className='';card.style.display='';
    var b=p.box.getBoundingClientRect();
    var dy=(a.top+a.height/2)-(b.top+b.height/2);
    p.box.animate([{transform:'translateY('+dy+'px) scale('+SC+')'},{transform:'none'}],{duration:600*S,easing:'cubic-bezier(.4,0,.3,1)',fill:'both'});
  },2300*S);
  wlAt(function(){card.className='wcard on';card.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'translateY(0)'}],{duration:500*S,easing:'cubic-bezier(.3,.05,.2,1)',fill:'both'});},2700*S);
}
function welcome(){
  if(!lsGet('bm_name_done')){wlFirst();return;}
  var seen=false;try{seen=!!sessionStorage.getItem('bm_splash');}catch(e){}
  if(seen||reduced()||!document.documentElement.animate)return;
  wlSplash();
}

/* ---------- start ---------- */
function start(){
  render();
  welcome();
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
  openDB().then(function(d){db=d;return dbAll();}).then(function(rows){state.books=rows;state.loaded=true;render();})
  .catch(function(){memoryOnly=true;state.loaded=true;render();toast('This browser mode can\'t save books');});
}
start();
checkUpdate();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkUpdate();});
window.__bm={lookup:doLookup,clean:cleanSynopsis,add:function(title,status,pages,author,owned){state.addAs=status||'toread';state.addOwned=owned!==false;makeBook({title:title,author:author||'',pages:pages||0});}};
})();
</script>
</body>
